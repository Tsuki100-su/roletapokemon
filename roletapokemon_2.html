<!doctype html>
<html lang="pt-BR">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1, viewport-fit=cover">
<title>Roleta Pokémon GBA</title>
<meta name="description" content="Roleta Pokémon com batalhas por turnos no estilo Game Boy Advance.">
<link rel="preconnect" href="https://fonts.googleapis.com">
<link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
<link href="https://fonts.googleapis.com/css2?family=Pixelify+Sans:wght@400&display=swap" rel="stylesheet">
<style>
/* ======================================================================
   Roleta Pokémon — visual de jogo de GBA (FireRed/LeafGreen)
   1 pixel de GBA = 2 px na tela. Fonte de pixel própria ("GBA"), molduras como as dos jogos.
   ====================================================================== */
:root {
  --bg1: #4a1414; --bg2: #140505; --accent: #ff5a3c;
  --ink: #f8f8f8; --muted: #b8c0d8;
  --gba: 'GBA', 'Pixelify Sans', 'Courier New', monospace;
  --gbas: 'GBA Pequena', 'GBA', 'Pixelify Sans', monospace;
  --pixel: var(--gba);
  /* caixa de texto da batalha (dourada) */
  --tb-bg: #285068; --tb-gold: #c8a048; --tb-hi: #e8c868; --tb-lo: #987028; --tb-out: #383020; --tb-pale: #f8e8b8; --tb-line: #183040;
  /* janelas de menu (brancas com moldura lilás) */
  --mn-bg: #f8f8f8; --mn-out: #383048; --mn-frame: #7870a8; --mn-hi: #a8a0d0; --mn-in: #e0e0f0;
  --dark: #484848; --dark-sh: #d0d0c8; --light: #f8f8f8; --light-sh: #685870;
  --slot: #3878c8; --slot-hi: #68a8e8; --slot-out: #203868; --sel: #f86830; --sel-fill: #88c8f8;
  --yellow: #f8d030; --yellow-d: #a88010; --red: #e04030; --red-d: #882018; --blue: #3878c8; --blue-d: #203868;
  --green: #38a858; --green-d: #186030; --gray: #687088; --gray-d: #383c50;
  color-scheme: dark;
}
* { box-sizing: border-box; }
html, body { height: 100%; margin: 0; }
body {
  font-family: var(--gba); font-size: 24px; line-height: 30px; color: var(--ink);
  background: linear-gradient(180deg, var(--bg1), var(--bg2) 75%) fixed, var(--bg2);
  overflow-x: hidden; -webkit-font-smoothing: none; font-smooth: never;
}
body::before {
  content: ""; position: fixed; inset: 0; pointer-events: none; opacity: .5;
  background-image: linear-gradient(rgba(255, 255, 255, .05) 2px, transparent 2px), linear-gradient(90deg, rgba(255, 255, 255, .05) 2px, transparent 2px);
  background-size: 16px 16px;
}
button { font: inherit; color: inherit; }
img { image-rendering: pixelated; }
img.broken { visibility: hidden; }
[hidden] { display: none !important; }
b { font-weight: normal; color: var(--yellow); }
.win b, .panel b, .modal-card b, .btn b { color: #c83828; }
.modal-card .det-stats b, .modal-card .ac b, .modal-card .skin b, .modal-card .mvrow b, .modal-card .set b { color: var(--dark); }

/* ---------- molduras (como nos jogos) ---------- */
.win, .msg, .panel, .modal-card, .attempt, .left-btns, #result, .toast {
  border-radius: 6px;
}
/* Janela branca com moldura lilás */
.win, .panel, .modal-card, .left-btns {
  background: var(--mn-bg); color: var(--dark);
  box-shadow: 0 0 0 2px var(--mn-out), inset 0 0 0 2px var(--mn-hi), inset 0 0 0 6px var(--mn-frame), inset 0 0 0 8px var(--mn-in), 0 8px 0 rgba(0, 0, 0, .25);
  text-shadow: 2px 0 var(--dark-sh), 0 2px var(--dark-sh), 2px 2px var(--dark-sh);
}
/* Caixa de texto azul com moldura dourada */
.msg, #result, .toast, .attempt {
  background: var(--tb-bg); color: var(--light);
  box-shadow: 0 0 0 2px var(--tb-out), inset 0 2px 0 0 var(--tb-hi), inset 0 0 0 6px var(--tb-gold), inset 0 0 0 8px var(--tb-pale), inset 0 0 0 10px var(--tb-line), 0 8px 0 rgba(0, 0, 0, .25);
  text-shadow: 2px 0 var(--light-sh), 0 2px var(--light-sh), 2px 2px var(--light-sh);
}

/* ---------- botões estilo opção de menu ---------- */
.btn {
  position: relative; display: inline-flex; align-items: center; justify-content: center; gap: 10px; cursor: pointer; border: 0; border-radius: 6px;
  padding: 10px 22px 10px 30px; font-family: var(--gba); font-size: 32px; line-height: 32px; color: var(--dark); background: var(--mn-bg);
  box-shadow: 0 0 0 2px var(--mn-out), inset 0 0 0 2px var(--mn-hi), inset 0 0 0 6px var(--mn-frame), inset 0 0 0 8px var(--mn-in), 0 6px 0 rgba(0, 0, 0, .3);
  text-shadow: 2px 0 var(--dark-sh), 0 2px var(--dark-sh), 2px 2px var(--dark-sh);
  transition: transform .05s;
}
.btn::before { content: ""; position: absolute; left: 12px; top: 50%; width: 0; height: 0; margin-top: -7px; border: 7px solid transparent; border-left: 8px solid #383838; border-right: 0; opacity: 0; }
.btn:hover::before, .btn:focus-visible::before { opacity: 1; }
.btn:active { transform: translateY(2px); }
.btn:focus-visible { outline: 2px dashed var(--yellow); outline-offset: 4px; }
.btn:disabled { opacity: .75; cursor: default; }
.btn:disabled::before { display: none; }
.btn svg { width: 22px; height: 22px; flex: none; }
.btn.yellow { background: #f8f0a0; }
.btn.green { background: #c8f0c0; }
.btn.red { background: #f8c8c0; }
.btn.blue { background: #c8d8f8; }
.btn.outline { background: #e8e8f0; }
.btn.gray { background: #e0e0e8; }
.btn.gray.off { opacity: .7; }
.btn.big { min-width: 180px; }
.btn.small { font-size: 16px; line-height: 16px; padding: 8px 12px 8px 22px; }
.btn.small::before { left: 8px; margin-top: -5px; border-width: 5px; border-left-width: 6px; }

#app {
  position: relative; display: grid; grid-template-columns: 230px minmax(0, 1fr) 350px; gap: 26px;
  min-height: 100%; padding-block: 20px; padding-left: max(18px, env(safe-area-inset-left, 0px)); padding-right: max(18px, env(safe-area-inset-right, 0px));
}

/* ---------- coluna esquerda (menu "START") ---------- */
#left { display: flex; flex-direction: column; gap: 16px; align-items: stretch; }
.logo { text-align: center; line-height: 1; padding: 4px 0 2px; }
.logo .l1, .logo .l2 { display: block; color: var(--yellow); text-shadow: 2px 0 #1f3c88, -2px 0 #1f3c88, 0 2px #1f3c88, 0 -2px #1f3c88, 2px 2px #1f3c88, -2px 2px #1f3c88, 2px -2px #1f3c88, -2px -2px #1f3c88, 0 6px #10204a, 4px 6px #10204a; }
.logo .l1 { font-size: 32px; }
.logo .l2 { font-size: 48px; margin-top: 4px; }
.logo .gba-tag { display: inline-block; margin-top: 10px; font-family: var(--gbas); font-size: 24px; padding: 4px 10px 2px; border-radius: 4px; background: #2b2f5a; color: #c8d0ff; box-shadow: 0 0 0 2px #6f7bd6; }
.attempt { text-align: center; padding: 14px 10px 12px; }
.attempt small { display: block; font-size: 24px; color: #c8e0f8; }
.attempt b { font-size: 32px; color: var(--light); }
.record { text-align: center; font-size: 24px; color: var(--muted); line-height: 30px; }
.record b { color: var(--ink); }
.left-btns { padding: 14px 10px; }
#left .left-btns .btn {
  width: 100%; justify-content: flex-start; background: transparent; box-shadow: none; font-size: 32px; padding: 6px 8px 6px 30px; min-width: 0;
}
#left .left-btns .btn svg { display: none; }
#left .left-btns .btn:hover, #left .left-btns .btn:focus-visible { background: #f0f0f8; }

/* ---------- centro ---------- */
#center { display: flex; flex-direction: column; align-items: center; text-align: center; min-width: 0; padding-top: 4px; }
#stageline { font-family: var(--gbas); font-size: 24px; color: var(--accent); text-shadow: 2px 2px 0 rgba(0, 0, 0, .6); }
#title { font-family: var(--gba); font-weight: normal; font-size: 32px; line-height: 36px; margin: 10px 0 6px; text-shadow: 2px 0 #202840, 0 2px #202840, 2px 2px #202840; text-wrap: balance; }
#subtitle { margin: 0 0 12px; color: #d8dcea; font-size: 24px; line-height: 30px; min-height: 30px; max-width: 70ch; text-wrap: balance; text-shadow: 2px 2px 0 rgba(0, 0, 0, .55); }
#subtitle b { color: var(--yellow); }
#stage { position: relative; width: 100%; display: flex; justify-content: center; }
#wheel-box { width: min(560px, 58vh, 92vw); aspect-ratio: 1; max-width: 100%; position: relative; }
#wheel { width: 100%; height: 100%; display: block; filter: drop-shadow(0 8px 0 rgba(0, 0, 0, .35)); }
#result {
  display: flex; align-items: center; gap: 12px; margin-top: -30px; z-index: 2; position: relative; visibility: hidden;
  padding: 12px 22px 10px 14px; font-size: 32px; line-height: 32px; transform: scale(.85); opacity: 0; transition: transform .2s steps(4), opacity .2s steps(4);
}
#result.show { visibility: visible; transform: none; opacity: 1; }
#result .ri { width: 64px; height: 64px; object-fit: contain; }
#actions { display: flex; gap: 16px; flex-wrap: wrap; justify-content: center; margin-top: 20px; min-height: 60px; }

#card { width: 100%; max-width: 720px; margin: 10px auto 0; }
.msg { display: flex; gap: 22px; align-items: center; justify-content: center; text-align: left; padding: 22px 26px; }
.msg-img { flex: none; display: flex; gap: 8px; align-items: flex-end; justify-content: center; padding: 6px 10px 2px; border-radius: 6px; background: linear-gradient(#e8f0d8, #d0e8c0 70%, #a8d088 70%, #c0e0a0); box-shadow: 0 0 0 2px #304038, inset 0 0 0 2px #f8f8f8; }
.msg-img img { width: 128px; height: 128px; object-fit: contain; }
.msg-img img.item-ic { width: 72px; height: 72px; margin: 28px; }
.msg-img img.trainer-big { width: 128px; height: 128px; }
.msg-text { font-size: 32px; line-height: 36px; min-width: 0; }
.msg-text small { display: inline-block; margin-top: 8px; font-size: 24px; line-height: 30px; color: #c8e0f8; }
.msg-text b { color: var(--yellow); }
.msg blockquote { margin: 0 0 12px; padding: 0; color: #f8e8b8; }
.msg.end { flex-direction: column; text-align: center; }
.msg .row { display: flex; flex-wrap: wrap; justify-content: center; gap: 6px; }
.end-sp { width: 128px; height: 128px; object-fit: contain; }
.msg.end .row { gap: 10px 14px; }
.hof { display: flex; flex-direction: column; align-items: center; width: 150px; font-size: 24px; line-height: 28px; text-align: center; }
.hint { color: #707088; font-size: 24px; line-height: 30px; margin: 8px 0; text-shadow: none; }
.msg .hint, .msg-text .hint { color: #c8e0f8; }
.type { display: inline-block; font-family: var(--gbas); font-size: 24px; line-height: 24px; padding: 3px 8px 1px; border-radius: 3px; color: #fff; text-shadow: 2px 2px 0 rgba(0, 0, 0, .35); vertical-align: middle; box-shadow: inset 0 -2px 0 rgba(0, 0, 0, .25); }
.matchup { display: flex; flex-direction: column; gap: 6px; margin: 10px 0; font-size: 24px; line-height: 30px; }
.matchup .good { color: #a8f0c0; } .matchup .bad { color: #f8b0a0; }
.matchup img.mini { width: 32px; height: 32px; object-fit: contain; vertical-align: middle; }

.gen-grid { display: grid; grid-template-columns: repeat(3, minmax(0, 1fr)); gap: 16px; max-width: 640px; margin: 10px auto 0; }
.gen-btn { cursor: pointer; border: 0; border-radius: 6px; padding: 14px 8px 12px; color: #fff; font-family: var(--gba); background: color-mix(in srgb, var(--gc) 60%, #182030);
  box-shadow: 0 0 0 2px #181828, inset 0 0 0 2px color-mix(in srgb, var(--gc) 50%, #fff), inset 0 0 0 6px color-mix(in srgb, var(--gc) 85%, #000), 0 6px 0 rgba(0, 0, 0, .35);
  display: flex; flex-direction: column; gap: 4px; text-shadow: 2px 2px 0 rgba(0, 0, 0, .5); }
.gen-btn b { font-size: 32px; line-height: 32px; color: #fff; }
.gen-btn span { font-size: 24px; }
.gen-btn small { font-size: 24px; opacity: .85; }
.gen-btn.locked { filter: grayscale(.85) brightness(.7); }
.gen-btn:hover { filter: brightness(1.12); }

/* ---------- coluna direita ---------- */
#right { display: flex; flex-direction: column; gap: 20px; }
.panel { padding: 14px 14px 16px; }
.panel header { display: flex; align-items: baseline; justify-content: space-between; margin: 0 4px 10px; }
.panel h2 { font-size: 32px; line-height: 32px; font-weight: normal; margin: 0; }
.panel header span { font-size: 24px; color: #707088; text-shadow: none; }
/* Equipe: igual à tela de POKéMON do GBA */
#team { display: grid; grid-template-columns: repeat(2, minmax(0, 1fr)); gap: 8px; margin-bottom: 12px; padding: 10px; border-radius: 4px; background: repeating-linear-gradient(135deg, #307068 0 10px, #2a6460 10px 14px); box-shadow: inset 0 0 0 2px #1c4844; }
.slot { position: relative; height: 72px; border: 0; border-radius: 6px; cursor: pointer; padding: 0 6px 0 66px; overflow: visible; display: flex; flex-direction: column; align-items: flex-start; justify-content: center; text-align: left;
  background: linear-gradient(var(--slot-hi) 0 4px, var(--slot) 4px); color: #fff; box-shadow: 0 0 0 2px var(--slot-out), inset 0 0 0 2px rgba(255, 255, 255, .25); text-shadow: 2px 2px 0 #283848; }
.slot.empty { cursor: default; background: #386070; box-shadow: 0 0 0 2px #284850; }
.slot:not(.empty):hover, .slot:not(.empty):focus-visible { background: linear-gradient(#c8e8f8 0 4px, var(--sel-fill) 4px); box-shadow: 0 0 0 2px var(--sel), inset 0 0 0 2px #f8b090; outline: none; }
.slot .sp { position: absolute; left: 2px; top: 2px; width: 64px; height: 64px; object-fit: cover; object-position: 50% 0; animation: icobob .6s steps(1) infinite; }
.slot:hover .sp { animation-duration: .3s; }
@keyframes icobob { 50% { object-position: 50% 100%; } }
.slot .sn { font-family: var(--gbas); font-size: 24px; line-height: 26px; white-space: nowrap; overflow: hidden; text-overflow: clip; max-width: 100%; }
.slot .sl { font-family: var(--gbas); font-size: 24px; line-height: 26px; color: #e0f0f8; }
.slot .stypes { position: absolute; right: 6px; bottom: 6px; display: flex; gap: 3px; }
.slot .stypes i { width: 8px; height: 8px; border-radius: 1px; box-shadow: 0 0 0 2px rgba(0, 0, 0, .35); }
#btn-pc { width: 100%; font-size: 32px; }
/* Insígnias: como o cartão de treinador */
#badges { padding: 10px; border-radius: 4px; background: linear-gradient(#f0d8a0, #e0c080); box-shadow: inset 0 0 0 2px #a07838; }
#badges .brow8 { display: grid; grid-template-columns: repeat(8, minmax(0, 1fr)); gap: 4px; }
#badges .brow4 { display: grid; grid-template-columns: repeat(5, minmax(0, 1fr)); gap: 6px; margin-top: 10px; }
.badge { position: relative; aspect-ratio: 1; border-radius: 4px; background: #c8a868; box-shadow: inset 0 0 0 2px #a08040; display: block; }
.badge i { position: absolute; inset: 24%; transform: rotate(45deg); background: #b89858; }
.badge.got { background: var(--bc); box-shadow: inset 0 0 0 2px rgba(0, 0, 0, .3), inset 4px 4px 0 rgba(255, 255, 255, .45); }
.badge.got i { background: rgba(255, 255, 255, .7); }
.badge.cur { box-shadow: inset 0 0 0 2px var(--sel); animation: pulse 1s steps(2) infinite; }
.badge.big { width: 128px; height: 128px; }
.elite { font-family: var(--gbas); font-size: 24px; aspect-ratio: 1; border-radius: 4px; display: grid; place-items: center; background: #c8a868; box-shadow: inset 0 0 0 2px #a08040; color: #806030; text-shadow: none; }
.elite.got { background: var(--accent); color: #fff; text-shadow: 2px 2px 0 rgba(0, 0, 0, .35); }
.elite.cur { box-shadow: inset 0 0 0 2px var(--sel); color: var(--sel); }
.elite.crown { font-size: 24px; }
/* Mochila: lista de itens */
#bag { display: flex; flex-direction: column; gap: 4px; padding: 6px; border-radius: 4px; background: #f8f8e8; box-shadow: inset 0 0 0 2px #d8d0b0; }
#bag .item { position: relative; display: flex; align-items: center; gap: 8px; border: 0; border-radius: 4px; padding: 0 8px 0 0; height: 44px; background: transparent; cursor: pointer; text-align: left; font-family: var(--gbas); font-size: 24px; line-height: 24px; color: var(--dark); min-width: 0; }
#bag .item span { overflow: hidden; white-space: nowrap; text-overflow: clip; }
#bag .item:hover, #bag .item:focus-visible { background: #f0e8c0; outline: none; }
#bag .item:hover::before { content: ""; position: absolute; left: -2px; top: 50%; margin-top: -7px; border: 7px solid transparent; border-left: 8px solid #383838; border-right: 0; }
#bag .item.usable span::after { content: " ✓"; color: var(--green); }
#bag .item img { width: 48px; height: 48px; flex: none; margin: -2px 0; }
#bag .item b { margin-left: auto; color: var(--dark); flex: none; }
#bag .hint { grid-column: 1 / -1; }
@keyframes pulse { 50% { box-shadow: inset 0 0 0 2px var(--yellow); } }

/* ---------- janelas (modais) ---------- */
#modal { position: fixed; inset: 0; z-index: 70; background: rgba(8, 10, 20, .7); display: flex; align-items: center; justify-content: center; padding: 16px; }
.modal-card { width: min(720px, 100%); max-height: calc(100% - 20px); overflow: auto; }
.modal-head { position: sticky; top: 0; display: flex; justify-content: space-between; align-items: center; padding: 14px 18px 12px; background: #304880; color: var(--light); border-radius: 6px 6px 0 0; box-shadow: inset 0 -2px 0 #182848; text-shadow: 2px 0 #182848, 0 2px #182848, 2px 2px #182848; z-index: 1; margin: 8px 8px 0; }
.modal-head h2 { margin: 0; font-size: 32px; line-height: 32px; font-weight: normal; }
.modal-head .x { background: none; border: 0; font-size: 32px; cursor: pointer; color: var(--light); padding: 0 4px; }
.modal-body { padding: 16px 22px 22px; font-size: 24px; line-height: 30px; }
.modal-body p { margin: 8px 0; }
.modal-body h3 { font-size: 32px; line-height: 32px; font-weight: normal; margin: 18px 0 10px; }
.set { display: flex; justify-content: space-between; gap: 14px; align-items: center; padding: 12px 0; border-bottom: 2px solid #e0e0ec; flex-wrap: wrap; }
.set b { color: var(--dark); font-size: 24px; }
.set small { display: block; color: #707088; font-size: 16px; line-height: 20px; text-shadow: none; }
.seg { display: flex; gap: 6px; flex-wrap: wrap; }
.seg button { cursor: pointer; border: 0; border-radius: 4px; padding: 6px 10px 4px; font-size: 24px; background: #e8e8f0; color: var(--dark); box-shadow: inset 0 0 0 2px #b8b8d0; }
.seg button.on { background: #f8f0a0; box-shadow: inset 0 0 0 2px var(--sel); }
.set.danger b { color: var(--red); }
.row-btns { display: flex; gap: 14px; flex-wrap: wrap; margin-top: 14px; }
.row-btns .btn { font-size: 24px; line-height: 24px; padding: 10px 14px 10px 26px; }
.row-btns .btn::before { left: 9px; margin-top: -5px; border-width: 5px; border-left-width: 6px; }
.ach { display: grid; grid-template-columns: repeat(auto-fill, minmax(230px, 1fr)); gap: 8px; }
.ac { display: flex; gap: 10px; align-items: center; background: #f0f0f8; border-radius: 4px; padding: 8px 10px; opacity: .55; box-shadow: inset 0 0 0 2px #d0d0e0; }
.ac.got { opacity: 1; box-shadow: inset 0 0 0 2px var(--yellow); background: #f8f8e0; }
.ac .ai { font-size: 22px; text-shadow: none; }
.ac b { color: var(--dark); }
.ac small { display: block; color: #707088; font-size: 16px; line-height: 20px; text-shadow: none; }
.skins { display: grid; grid-template-columns: repeat(auto-fill, minmax(140px, 1fr)); gap: 8px; }
.skin { cursor: pointer; border: 0; background: #f0f0f8; border-radius: 4px; padding: 10px; display: flex; flex-direction: column; align-items: center; gap: 4px; box-shadow: inset 0 0 0 2px #d0d0e0; font-size: 24px; }
.skin i { width: 40px; height: 40px; border-radius: 50%; border: 6px solid var(--rim); box-shadow: 0 0 0 2px var(--st); }
.skin b { color: var(--dark); }
.skin small { color: #707088; font-size: 16px; text-align: center; text-shadow: none; }
.skin.sel { box-shadow: inset 0 0 0 2px var(--sel); }
.skin.locked { opacity: .5; }
/* PC do Bill: caixa estilo GBA */
.pc .pcgrid { display: grid; grid-template-columns: repeat(auto-fill, minmax(100px, 1fr)); gap: 6px; padding: 8px; border-radius: 4px; background: repeating-linear-gradient(135deg, #5888c8 0 8px, #5080c0 8px 12px); box-shadow: inset 0 0 0 2px #304878; }
.pcs { cursor: pointer; border: 0; border-radius: 4px; padding: 4px 4px 6px; display: flex; flex-direction: column; align-items: center; font-family: var(--gbas); font-size: 24px; line-height: 26px; color: #fff; background: rgba(255, 255, 255, .14); text-shadow: 2px 2px 0 #283848; }
.pcs small { color: #e0f0f8; font-size: 24px; }
.pcs.sel { background: var(--sel-fill); box-shadow: inset 0 0 0 2px var(--sel); }
.pcs:hover { background: rgba(255, 255, 255, .28); }
.pci { width: 64px; height: 64px; object-fit: cover; object-position: 50% 0; animation: icobob .6s steps(1) infinite; }
.pc-actions { display: flex; gap: 10px; flex-wrap: wrap; margin-top: 14px; }
.pc-actions .btn { font-size: 24px; line-height: 24px; padding: 10px 14px 10px 26px; }
.pc-actions .btn::before { left: 9px; margin-top: -5px; border-width: 5px; border-left-width: 6px; }
/* Resumo do Pokémon */
.det-top { display: flex; gap: 18px; align-items: center; }
.det-sp { width: 128px; height: 128px; object-fit: contain; flex: none; border-radius: 6px; background: linear-gradient(#e8f0d8, #d0e8c0 70%, #a8d088 70%, #c0e0a0); box-shadow: 0 0 0 2px #304038, inset 0 0 0 2px #f8f8f8; }
.xpline { height: 8px; background: #b0b090; border-radius: 2px; overflow: hidden; width: 240px; max-width: 100%; box-shadow: 0 0 0 2px #405048; }
.xpline i { display: block; height: 100%; background: #40c8f8; box-shadow: inset 0 2px 0 #88e0f8; }
.det-stats { display: grid; grid-template-columns: repeat(2, minmax(0, 1fr)); gap: 8px 18px; margin: 14px 0; }
.det-stats div { display: grid; grid-template-columns: 1fr auto; gap: 4px 8px; font-size: 24px; }
.det-stats b { color: var(--dark); }
.det-stats i { grid-column: 1 / -1; height: 6px; border-radius: 1px; background: #58d080; max-width: 100%; box-shadow: inset 0 2px 0 #70f8a8; }
.mvrow { display: flex; gap: 10px; align-items: center; padding: 8px 0; border-top: 2px solid #e0e0ec; flex-wrap: wrap; font-size: 24px; }
.mvrow b { color: var(--dark); }
.mvrow small { color: #707088; text-shadow: none; }
.g.m { color: #3890f8; } .g.f { color: #f85858; }
.hearts { color: #e85070; letter-spacing: 2px; }

/* ---------- aviso de sprites bloqueados ---------- */
#netwarn { position: fixed; left: 50%; top: 12px; transform: translateX(-50%); width: min(94vw, 720px); z-index: 85; padding: 16px 20px 14px; border-radius: 6px; font-size: 24px; line-height: 30px;
  background: var(--tb-bg); color: var(--light); box-shadow: 0 0 0 2px var(--tb-out), inset 0 0 0 6px #e04838, inset 0 0 0 8px var(--tb-pale), inset 0 0 0 10px var(--tb-line), 0 8px 0 rgba(0, 0, 0, .35);
  text-shadow: 2px 0 var(--light-sh), 0 2px var(--light-sh), 2px 2px var(--light-sh); }
#netwarn p { margin: 0 0 6px; }
#netwarn .row-btns { margin-top: 8px; }

/* ---------- avisos e confete ---------- */
#toasts { position: fixed; top: 14px; left: 50%; transform: translateX(-50%); z-index: 90; display: flex; flex-direction: column; gap: 10px; align-items: center; pointer-events: none; width: min(92vw, 480px); }
.toast { display: flex; gap: 10px; align-items: center; padding: 14px 18px 12px; animation: tin .25s steps(3); font-size: 24px; line-height: 30px; }
.toast .ti { font-size: 22px; text-shadow: none; }
.toast.out { opacity: 0; transition: opacity .3s steps(3); }
@keyframes tin { from { opacity: 0; transform: translateY(-10px); } }
#confetti { position: fixed; inset: 0; pointer-events: none; z-index: 95; overflow: hidden; }
#confetti i { position: absolute; top: -12px; width: 8px; height: 8px; animation: fall var(--d) steps(40) forwards; }
@keyframes fall { to { transform: translate(var(--x), 105vh) rotate(720deg); } }
#app.shake { animation: appshake .4s steps(4); }
@keyframes appshake { 20%, 60% { transform: translateX(-6px); } 40%, 80% { transform: translateX(6px); } }

/* ======================================================================
   Tela de batalha: um "console" com a tela de 240×160 no meio (desenhada em canvas)
   ====================================================================== */
#battle { position: fixed; inset: 0; z-index: 60; background: radial-gradient(circle at 50% 35%, #232846, #07080d 78%); display: flex; flex-direction: column; align-items: center; justify-content: center; gap: 10px; user-select: none; -webkit-user-select: none; touch-action: manipulation; }
.gba-console { display: flex; align-items: center; gap: 22px; padding: 18px 26px; border-radius: 26px 26px 60px 60px; background: linear-gradient(180deg, #6a5cc0 0%, #5546a8 55%, #46388f 100%); box-shadow: inset 0 3px 0 rgba(255, 255, 255, .25), inset 0 -6px 0 rgba(0, 0, 0, .25), 0 26px 70px rgba(0, 0, 0, .65); }
.gba-mid { display: flex; flex-direction: column; align-items: center; }
.gba-bezel { padding: 14px 18px; border-radius: 14px 14px 34px 14px; background: #2b2d3c; box-shadow: inset 0 0 0 2px #1a1b25, inset 0 4px 10px rgba(0, 0, 0, .55); }
.gba-screen { display: block; image-rendering: pixelated; image-rendering: crisp-edges; background: #000; cursor: pointer; }
.gba-side { display: flex; align-items: center; justify-content: center; width: 110px; }
.dpad { position: relative; width: 96px; height: 96px; }
.dpad .dp { position: absolute; width: 32px; height: 32px; border: 0; padding: 0; background: #23232c; cursor: pointer; box-shadow: inset 0 -3px 0 rgba(0, 0, 0, .45); }
.dpad .dp.up { left: 32px; top: 0; border-radius: 5px 5px 0 0; }
.dpad .dp.down { left: 32px; bottom: 0; border-radius: 0 0 5px 5px; }
.dpad .dp.left { left: 0; top: 32px; border-radius: 5px 0 0 5px; }
.dpad .dp.right { right: 0; top: 32px; border-radius: 0 5px 5px 0; }
.dpad .dp-mid { position: absolute; left: 32px; top: 32px; width: 32px; height: 32px; background: #23232c; }
.dpad .dp::after { content: ""; position: absolute; inset: 0; margin: auto; width: 0; height: 0; border: 6px solid transparent; }
.dpad .dp.up::after { border-bottom-color: #4a4a58; border-top-width: 0; }
.dpad .dp.down::after { border-top-color: #4a4a58; border-bottom-width: 0; }
.dpad .dp.left::after { border-right-color: #4a4a58; border-left-width: 0; }
.dpad .dp.right::after { border-left-color: #4a4a58; border-right-width: 0; }
.dpad .dp.pressed, .dpad .dp:active { background: #15151b; box-shadow: none; }
.ab { position: relative; width: 104px; height: 90px; }
.abtn { position: absolute; width: 46px; height: 46px; border-radius: 50%; border: 0; cursor: pointer; font-family: 'GBA', var(--pixel); font-size: 32px; line-height: 46px; padding: 0; color: #3a3060; background: radial-gradient(circle at 40% 35%, #f2f0fa, #c9c4dc 70%); box-shadow: inset 0 -4px 0 rgba(0, 0, 0, .22), 0 3px 0 #2c2468; }
.abtn.a { right: 0; top: 0; }
.abtn.b { left: 0; bottom: 0; }
.abtn.pressed, .abtn:active { transform: translateY(2px); box-shadow: inset 0 -1px 0 rgba(0, 0, 0, .2), 0 1px 0 #2c2468; }
.gba-console.portrait { gap: 14px; padding: 14px 12px 20px; border-radius: 22px 22px 46px 22px; display: grid; grid-template-columns: 1fr 1fr; grid-template-areas: "screen screen" "pad ab"; }
.gba-console.portrait .gba-mid { grid-area: screen; }
.gba-console.portrait .gba-left { grid-area: pad; justify-self: start; }
.gba-console.portrait .gba-right { grid-area: ab; justify-self: end; }
.gba-console.portrait .gba-bezel { padding: 8px; border-radius: 10px 10px 22px 10px; }
.battle-bar { display: flex; gap: 8px; align-items: center; flex-wrap: wrap; justify-content: center; max-width: 100vw; padding: 0 12px; }
.bb { cursor: pointer; font-family: 'GBA', var(--pixel); font-size: 24px; border: 1px solid rgba(255, 255, 255, .25); background: rgba(255, 255, 255, .08); color: #e8e8f0; border-radius: 7px; padding: 6px 12px; }
.bb.auto.on { background: var(--yellow); color: #3a2a00; border-color: var(--yellow); }
.battle-bar .keys { font-size: 16px; color: #8d93a8; }
body.in-battle { overflow: hidden; }



/* ---------- telas menores ---------- */
@media (max-width: 1240px) {
  #app { grid-template-columns: 200px minmax(0, 1fr) 300px; gap: 18px; }
  .logo .l1 { font-size: 32px; } .logo .l2 { font-size: 32px; }
  #left .left-btns .btn { font-size: 16px; line-height: 20px; }
}
@media (max-width: 960px) {
  #app { grid-template-columns: 1fr; gap: 16px; padding-block: 12px; }
  #left { display: grid; grid-template-columns: auto 1fr; grid-template-areas: "logo attempt" "logo record" "btns btns"; gap: 10px 16px; align-items: center; }
  .logo { grid-area: logo; padding: 0; } .logo .l1 { font-size: 24px; } .logo .l2 { font-size: 32px; } .logo .gba-tag { margin-top: 6px; font-size: 16px; }
  .attempt { grid-area: attempt; padding: 10px 12px 8px; display: flex; gap: 10px; align-items: center; justify-content: center; }
  .attempt small { display: inline; }
  .attempt b { font-size: 32px; }
  .record { grid-area: record; }
  #left .left-btns { grid-area: btns; display: grid; grid-template-columns: repeat(4, minmax(0, 1fr)); gap: 4px; padding: 10px; }
  #left .left-btns .btn { justify-content: center; font-size: 24px; padding: 8px 4px 8px 16px; }
  #left .left-btns .btn::before { left: 4px; margin-top: -5px; border-width: 5px; border-left-width: 6px; }
  #wheel-box { width: min(92vw, 480px); }
  .msg { flex-direction: column; text-align: center; padding: 18px; }
  #right { display: grid; grid-template-columns: repeat(auto-fit, minmax(300px, 1fr)); }
}
@media (min-width: 961px) { #left .left-btns { display: flex; flex-direction: column; gap: 2px; } }
@media (max-width: 520px) {
  #title { font-size: 32px; line-height: 34px; }
  .msg-text { font-size: 32px; line-height: 34px; }
  .msg-img img { width: 96px; height: 96px; }
  .btn { font-size: 32px; }
  .btn.big { min-width: 140px; }
  #left .left-btns { grid-template-columns: repeat(2, minmax(0, 1fr)); }
  .gen-grid { grid-template-columns: repeat(2, minmax(0, 1fr)); }
  #team { grid-template-columns: 1fr 1fr; }
  .battle-bar .keys { display: none; }
}
@media (prefers-reduced-motion: reduce) {
  *, *::before, *::after { animation-duration: .01ms !important; transition-duration: .01ms !important; }
}

    const [id, name, t, cat, bp, acc, pp, prio, eff] = line.split('|');
    // Nos dados, golpes de status vieram marcados como "S" com poder 0: aqui eles viram "status".
    const isStatus = cat !== 'P' && +bp === 0 && !ZERO_BP_DAMAGE.has(id) && !(eff && eff.includes('"dm"'));
    const m = {
      id, idx: i, en: name, name: (typeof MOVE_PT !== 'undefined' && MOVE_PT[id]) || name,
      type: TYPE_CODES[t], cat: cat === 'P' ? 'phys' : isStatus ? 'status' : 'spec',
      bp: +bp, acc: acc === 't' ? true : +acc, pp: +pp, prio: +prio, e: eff ? JSON.parse(eff) : {},
    };
    MOVES[id] = m;
    MOVE_INDEX[i] = id;

  if (!MOVES.tackle) throw new Error('dados de golpes incompletos');

  const learnLines = learnTxt.replace(/\n$/, '').split('\n');
  speciesTxt.trim().split('\n').forEach((line, i) => {
    const [num, name, types, st, prevo, evoLevel, evoType, gender, flags, cr, bx] = line.split('|');
    const id = +num;
    const base = st.split('.').map(Number);
    const learn = [];
    const L = learnLines[i] || '';
    for (let k = 0; k + 4 <= L.length; k += 4) {
      const lvl = parseInt(L.slice(k, k + 2), 36);
      const mid = MOVE_INDEX[parseInt(L.slice(k + 2, k + 4), 36)];
      if (mid) learn.push([lvl, mid]);
    }
    if (!learn.length) learn.push([1, 'tackle']);

      id, name, types: types.split('').map((c) => TYPE_CODES[c]), base, bst: base.reduce((a, b) => a + b, 0),
      prevo: prevo ? +prevo : null, evoLevel: evoLevel ? +evoLevel : null, evoType: evoType || null,
      gender: +gender, legendary: flags.includes('L'), mythical: flags.includes('M'), baby: flags.includes('B'),
      ub: flags.includes('U'), paradox: flags.includes('X'), catchRate: +cr || 45, bexp: +bx || 100,

function evoLevelOf(id) {

let UID = 1;
function calcStats(id, level, ivs) {
  const b = SPECIES[id].base;

  const rest = [1, 2, 3, 4, 5].map((i) => Math.floor(((2 * b[i] + ivs[i]) * level) / 100) + 5);

function movesFor(id, level, smart = false) {
  const learned = [];
  for (const [l, m] of SPECIES[id].learn) {
    if (Math.max(1, l) <= level && !learned.includes(m)) learned.push(m);
  }
  if (!learned.length) learned.push(SPECIES[id].learn[0][1]);
  let chosen;
  if (!smart) {
    chosen = learned.slice(-4);
  } else {
    const types = SPECIES[id].types;
    const dmg = learned.filter((m) => MOVES[m].cat !== 'status').map((m) => {
      const mv = MOVES[m];
      const bp = effectiveBasePower(mv);
      return { m, s: bp * (types.includes(mv.type) ? 1.5 : 1) * ((mv.acc === true ? 100 : mv.acc) / 100) * (mv.e.f && mv.e.f.includes('r') ? 0.6 : 1) * (mv.e.f && mv.e.f.includes('c') ? 0.7 : 1), t: mv.type };
    }).sort((a, b) => b.s - a.s);
    chosen = [];
    const usedTypes = {};
    for (const d of dmg) {
      if (chosen.length >= 3) break;
      if (usedTypes[d.t] && dmg.some((x) => !usedTypes[x.t] && !chosen.includes(x.m) && x.s > d.s * 0.6)) continue;
      chosen.push(d.m); usedTypes[d.t] = 1;
    }
    const status = learned.filter((m) => MOVES[m].cat === 'status' && statusValue(MOVES[m]) > 0).sort((a, b) => statusValue(MOVES[b]) - statusValue(MOVES[a]));
    if (status.length) chosen.push(status[0]);
    for (const d of dmg) { if (chosen.length >= 4) break; if (!chosen.includes(d.m)) chosen.push(d.m); }
    for (const m of learned.slice().reverse()) { if (chosen.length >= 4) break; if (!chosen.includes(m)) chosen.push(m); }

    }

  if (e.st === 'z') return 50;
  if (e.st) return 40;
  if (e.v === 'cf') return 25;
  if (e.hl || ['rest', 'synthesis', 'moonlight', 'morningsun', 'roost', 'shoreup', 'wish'].includes(mv.id)) return 30;
  if (e.b && e.tg === 's') return 35;

  typesOf(s) { const sd = this.sides[s]; return sd.vol.transform ? sd.vol.transform.types : SPECIES[sd.mon.id].types; }
  rawStat(s, k) { const sd = this.sides[s]; const i = STAT_KEYS.indexOf(k); return sd.vol.transform && i > 0 ? sd.vol.transform.stats[i] : stats(sd.mon)[i]; }
  stat(s, k, ignoreNeg = false, ignorePos = false) {
    let st = this.sides[s].boosts[k];
    if (ignoreNeg && st < 0) st = 0;
    if (ignorePos && st > 0) st = 0;
    let v = this.rawStat(s, k) * STAGE_MULT(st);
    if (k === 'spe' && this.sides[s].mon.status === 'par') v *= 0.5;
    return Math.max(1, Math.floor(v));
  }
  movesOf(s) { const sd = this.sides[s]; return sd.vol.transform ? sd.vol.transform.moves : sd.mon.moves; }
  alive(list) { return list.filter((p) => curHp(p) > 0); }
  label(s) { const n = NAME(this.sides[s].mon); if (s === 'p') return n; return this.wild ? `${n} selvagem` : `${n} inimigo`; }
  Label(s) { const t = this.label(s); return t; }

  async run() {
    const ui = this.ui;
    await ui.intro(this);
    // Manda o primeiro Pokémon de cada lado.
    const firstEnemy = this.enemy[0];
    await this.sendOut('e', firstEnemy, true);
    const first = this.party.find((p) => curHp(p) > 0);
    await this.sendOut('p', first, true);

    while (!this.result) {
      this.turn++;
      const pAct = await this.playerAction();
      if (this.result) break;
      const eAct = this.enemyAction();
      await this.resolveTurn(pAct, eAct);
      if (this.result) break;
      await this.endOfTurn();
      if (this.result) break;
      await this.checkFaints();
    }
    // Limpa efeitos da Transformação e volta tudo ao normal na tela.
    await ui.outro(this);
    return this.result;
  }

  async sendOut(s, mon, first = false) {
    const sd = this.sides[s];
    const prev = sd.mon;
    sd.mon = mon;
    sd.vol = { firstTurn: true };
    sd.boosts = this.zeroBoosts();
    if (mon.status === 'tox') mon.toxN = 1;
    if (s === 'p') this.participants.add(mon.uid);
    await this.ui.sendOut(this, s, mon, prev, first);
    if (s === 'e') this.participants = new Set([this.sides.p.mon ? this.sides.p.mon.uid : null].filter(Boolean));
  }

  // ---------- escolha de ação do jogador ----------
  async playerAction() {
    const sd = this.sides.p;
    if (sd.vol.recharge) { return { type: 'recharge' }; }
    if (sd.vol.charging) { return { type: 'move', id: sd.vol.charging, forced: true }; }
    for (;;) {
      const act = this.o.auto ? this.autoAction() : await this.ui.chooseAction(this);
      if (act.type === 'run') {
        if (!this.wild) { await this.ui.msg('Não! Não dá para fugir de uma batalha contra treinador!'); continue; }
        if (sd.vol.trapped) { await this.ui.msg(`${NAME(sd.mon)} está preso e não pode fugir!`); continue; }
        this.runAttempts++;
        const ps = this.stat('p', 'spe'), es = this.stat('e', 'spe');
        const ok = ps >= es || rnd(256) < Math.floor((ps * 128) / es + 30 * this.runAttempts) % 256;
        if (ok) { await this.ui.msg('Você fugiu sem problemas!'); this.result = 'run'; return act; }
        await this.ui.msg('Não conseguiu fugir!');
        return { type: 'none' };
      }
      if (act.type === 'switch') {
        if (sd.vol.trapped) { await this.ui.msg(`${NAME(sd.mon)} está preso e não pode voltar!`); continue; }
        return act;
      }
      if (act.type === 'ball' && !this.wild) { await this.ui.msg('Não dá para capturar o Pokémon de outro treinador!'); continue; }
      return act;
    }
  }

  // AUTO: decide sozinho (bom para gravar vídeo).
  autoAction() {
    const sd = this.sides.p, ed = this.sides.e;
    if (this.wild && this.o.canCatch && this.party.length < 999) {
      const frac = curHp(ed.mon) / maxHp(ed.mon);
      if (frac <= 0.5 || this.turn > 4) return { type: 'ball', key: 'pokeball' };
      const safe = this.movesOf('p').map((m, i) => ({ m, i })).filter(({ m }) => m.pp > 0 && MOVES[m.id].cat !== 'status')
        .map(({ m, i }) => ({ i, d: this.estimate('p', MOVES[m.id]) })).filter((x) => x.d > 0 && x.d < curHp(ed.mon) * 0.8)
        .sort((a, b) => b.d - a.d);
      if (safe.length) return { type: 'move', index: safe[0].i };
      if (this.movesOf('p').some((m) => m.pp > 0 && MOVES[m.id].cat === 'status')) {
        const st = this.movesOf('p').findIndex((m) => m.pp > 0 && MOVES[m.id].cat === 'status' && MOVES[m.id].e.st && !ed.mon.status);
        if (st >= 0) return { type: 'move', index: st };
      }
      return { type: 'ball', key: 'pokeball' };
    }
    const i = this.aiPickMove('p', 1);
    return i < 0 ? { type: 'move', index: -1 } : { type: 'move', index: i };
  }

  // ---------- IA do inimigo ----------
  enemyAction() {
    const sd = this.sides.e;
    if (sd.vol.recharge) return { type: 'recharge' };
    if (sd.vol.charging) return { type: 'move', id: sd.vol.charging, forced: true };
    const st = this.o.stage ?? 6;
    const smart = this.wild ? 0 : this.kind === 'boss' ? (st === 0 ? 0 : st <= 1 ? 0.4 : st <= 3 ? 0.65 : 0.85) : this.kind === 'rival' || this.kind === 'villain' ? 0.6 : 0.5;
    // Líderes usam itens de cura.
    if (!this.wild && this.items.length && curHp(sd.mon) / maxHp(sd.mon) < 0.25 && chance(0.6)) {
      return { type: 'enemyItem', key: this.items.shift() };
    }
    const i = this.aiPickMove('e', smart);
    return { type: 'move', index: i };
  }

  estimate(s, mv) {
    if (mv.cat === 'status') return 0;
    const t = this.other(s);
    const r = this.calcDamage(s, t, mv, { estimate: true });
    return r.damage;
  }

  aiPickMove(s, smart) {
    const moves = this.movesOf(s);
    const usable = moves.map((m, i) => ({ m, i })).filter(({ m }) => m.pp > 0);
    if (!usable.length) return -1;
    if (!smart || !chance(smart)) {
      if (!smart) return pick(usable).i;
      // Aleatório com peso pelo dano.
      const w = usable.map(({ m }) => Math.max(5, this.scoreMove(s, MOVES[m.id])));
      let r = Math.random() * w.reduce((a, b) => a + b, 0);
      for (let k = 0; k < usable.length; k++) { r -= w[k]; if (r <= 0) return usable[k].i; }
      return usable[0].i;
    }
    let best = usable[0], bestS = -1;
    for (const u of usable) { const sc = this.scoreMove(s, MOVES[u.m.id]) * (0.9 + Math.random() * 0.2); if (sc > bestS) { bestS = sc; best = u; } }
    return best.i;
  }

  scoreMove(s, mv) {
    const t = this.other(s), me = this.sides[s], tg = this.sides[t];
    const tgHp = curHp(tg.mon), myFrac = curHp(me.mon) / maxHp(me.mon);
    if (mv.cat !== 'status') {
      if (mv.id === 'dreameater' && tg.mon.status !== 'slp') return 0;
      if ((mv.id === 'fakeout' || mv.id === 'firstimpression') && !me.vol.firstTurn) return 0;
      if (['explosion', 'selfdestruct', 'mistyexplosion'].includes(mv.id) && myFrac > 0.3) return 1;
      if (['counter', 'mirrorcoat'].includes(mv.id)) return 25;
      if (mv.type === 'ground' && LEVITATE.has(tg.mon.id)) return 0;
      if (tg.mon.id === WONDER_GUARD && typeEff(mv.type, this.typesOf(t), mv.id) <= 1) return 0;
      const d = this.estimate(s, mv);
      const acc = mv.acc === true ? 1 : mv.acc / 100;
      let sc = (d / Math.max(1, tgHp)) * 100 * acc;
      if (d >= tgHp) sc += 80 * acc;
      if (mv.e.f && mv.e.f.includes('r')) sc *= 0.75;
      if (mv.e.f && mv.e.f.includes('c')) sc *= 0.7;
      return sc;
    }
    const e = mv.e;
    if (mv.id === 'splash' || mv.id === 'celebrate') return 1;
    if (mv.id === 'teleport') return this.wild && s === 'e' ? 30 : 0;
    if (mv.id === 'transform') return me.vol.transform ? 0 : 60;
    if (e.st) {
      if (tg.mon.status || !this.canStatus(t, e.st, mv.id)) return 0;
      return e.st === 'z' ? 55 : e.st === 'p' ? 42 : e.st === 't' ? 38 : 34;
    }
    if (e.v === 'cf') return tg.vol.confusion ? 0 : 26;
    if (e.v === 'leechseed') return tg.vol.leechseed || this.typesOf(t).includes('grass') ? 0 : 32;
    if (e.v === 'protect') return me.vol.protectCount ? 2 : 12;
    if (e.hl || ['synthesis', 'moonlight', 'morningsun', 'roost', 'shoreup', 'recover', 'wish', 'lifedew'].includes(mv.id)) return myFrac < 0.45 ? 70 : 0;
    if (mv.id === 'rest') return myFrac < 0.35 ? 60 : 0;
    if (e.b && (e.tg === 's' || (!e.v && !e.st && Object.values(e.b).every((v) => v > 0)))) { const k = Object.keys(e.b)[0]; return myFrac > 0.55 && me.boosts[k] < 2 ? 30 : 3; }
    if (e.b) { const k = Object.keys(e.b)[0]; return tg.boosts[k] > -2 ? 16 : 2; }
    if (mv.id === 'reflect' || mv.id === 'lightscreen') return me.screens[mv.id === 'reflect' ? 'reflect' : 'light'] ? 0 : 20;
    if (mv.id === 'curse') return 20;
    return 8;
  }

  // ---------- turno ----------
  async resolveTurn(pAct, eAct) {
    const acts = [];
    if (pAct.type !== 'none') acts.push({ s: 'p', a: pAct });
    if (eAct.type !== 'none') acts.push({ s: 'e', a: eAct });
    const prio = ({ s, a }) => {
      if (a.type === 'switch' || a.type === 'item' || a.type === 'ball' || a.type === 'enemyItem') return 10;
      if (a.type === 'move') { const mv = this.actionMove(s, a); return mv ? mv.prio : 0; }
      return 0;
    };
    acts.forEach((x) => { x.p = prio(x); x.spd = this.stat(x.s, 'spe'); x.tie = Math.random(); });
    acts.sort((a, b) => b.p - a.p || b.spd - a.spd || a.tie - b.tie);
    this.order = acts.map((x) => x.s);
    this.turnActs = { p: pAct, e: eAct };
    this.moved = { p: false, e: false };
    this.hitThisTurn = { p: null, e: null };
    for (const x of acts) {
      if (this.result) return;
      if (!this.sides[x.s].mon || curHp(this.sides[x.s].mon) <= 0) continue;
      await this.doAction(x.s, x.a);
      this.moved[x.s] = true;
      if (this.result) return;
      // Alguém desmaiou no meio do turno: para o turno.
      if (curHp(this.sides.p.mon) <= 0 || curHp(this.sides.e.mon) <= 0) break;
    }
  }

  actionMove(s, a) {
    if (a.id) return MOVES[a.id];
    const moves = this.movesOf(s);
    if (a.index < 0 || !moves[a.index]) return MOVES.struggle;
    return MOVES[moves[a.index].id];
  }

  async doAction(s, a) {
    const ui = this.ui;
    if (a.type === 'recharge') { this.sides[s].vol.recharge = false; await ui.msg(`${this.label(s)} precisa recarregar!`); return; }
    if (a.type === 'switch') {
      await ui.msg(`Volte, ${NAME(this.sides.p.mon)}!`);
      await this.sendOut('p', this.party[a.index]);
      return;
    }
    if (a.type === 'item') { await this.useItem(a); return; }
    if (a.type === 'enemyItem') {
      const tr = this.o.trainer;
      const mon = this.sides.e.mon;
      const heal = a.key === 'superpotion' ? maxHp(mon) : Math.floor(maxHp(mon) / 2);
      await ui.msg(`${tr.name.toUpperCase()} usou ${ITEMS[a.key] ? ITEMS[a.key].name.toUpperCase() : 'POÇÃO'}!`);
      const from = curHp(mon);
      mon.hpLost = Math.max(0, mon.hpLost - heal);
      await ui.hp(this, 'e', from, curHp(mon));
      await ui.msg(`O HP de ${this.label('e')} foi recuperado.`);
      return;
    }
    if (a.type === 'ball') { await this.throwBall(a.key); return; }
    if (a.type === 'move') {
      const sd = this.sides[s];
      let mv = this.actionMove(s, a);
      let slot = null;
      if (!a.forced && mv.id !== 'struggle') {
        slot = this.movesOf(s)[a.index];
      }
      await this.useMove(s, mv, slot, a.forced);
      sd.vol.firstTurn = false;
    }
  }

  // ---------- itens do jogador ----------
  async useItem(a) {
    const ui = this.ui;
    const target = this.party[a.target ?? this.party.indexOf(this.sides.p.mon)];
    ui.consumeItem(a.key);
    await ui.msg(`Você usou ${ITEMS[a.key].name.toUpperCase()}!`);
    if (a.key === 'potion' || a.key === 'superpotion') {
      const isActive = target === this.sides.p.mon;
      const from = curHp(target);
      const heal = a.key === 'superpotion' ? maxHp(target) : Math.max(20, Math.floor(maxHp(target) / 2));
      target.hpLost = Math.max(0, target.hpLost - heal);
      if (isActive) await ui.hp(this, 'p', from, curHp(target));
      await ui.msg(`O HP de ${NAME(target)} foi recuperado em ${curHp(target) - from} pontos.`);
    } else if (a.key === 'xattack') {
      await this.applyBoosts('p', { atk: 2, spa: 2 }, true);
    }
  }

  async throwBall(key) {
    const ui = this.ui;
    const mon = this.sides.e.mon;
    const s = SPECIES[mon.id];
    if (key !== 'pokeball') ui.consumeItem(key);
    const ballName = key === 'pokeball' ? 'POKÉ BOLA' : ITEMS[key].name.toUpperCase();
    await ui.msg(`Você jogou uma ${ballName}!`, { noWait: true });
    let shakes = 0, caught = false;
    if (key === 'masterball') { shakes = 4; caught = true; }
    else {
      let rate = s.catchRate;
      if (isSpecial(s)) rate = Math.max(rate, this.o.legendRate || 25);
      const ball = key === 'pokeball' ? 1 : ITEMS[key].rate;
      const st = mon.status === 'slp' || mon.status === 'frz' ? 2.5 : mon.status ? 1.5 : 1;
      const M = maxHp(mon), H = curHp(mon);
      const a = Math.floor((((3 * M - 2 * H) * rate * ball) / (3 * M)) * st);
      if (a >= 255) { shakes = 4; caught = true; }
      else {
        const b = Math.floor(1048560 / Math.floor(Math.sqrt(Math.floor(Math.sqrt(Math.floor(16711680 / Math.max(1, a)))))));
        while (shakes < 4 && rnd(65536) < b) shakes++;
        caught = shakes === 4;
      }
    }
    await ui.catchAnim(this, key, Math.min(3, shakes), caught);
    if (caught) {
      await ui.msg(`Pronto! ${NAME(mon)} foi capturado!`, { sound: 'caught' });
      this.caught = mon;
      await this.giveExp(mon);
      this.result = 'caught';
      return;
    }
    const lines = ['Ah, não! O Pokémon escapou!', 'Droga! Parecia que tinha pegado!', 'Argh! Foi por pouco!', 'Ufa! Quase!'];
    await ui.msg(lines[Math.min(3, shakes)]);
  }

  // ---------- golpes ----------
  canStatus(t, st, moveId) {
    const mon = this.sides[t].mon;
    if (mon.status) return false;
    const types = this.typesOf(t);
    const code = { b: 'brn', p: 'par', s: 'psn', t: 'tox', z: 'slp', f: 'frz' }[st] || st;
    if (code === 'brn' && types.includes('fire')) return false;
    if (code === 'par' && types.includes('electric')) return false;
    if ((code === 'psn' || code === 'tox') && (types.includes('poison') || types.includes('steel'))) return false;
    if (code === 'frz' && types.includes('ice')) return false;
    if (moveId && POWDER.has(moveId) && types.includes('grass')) return false;
    if (moveId === 'thunderwave' && types.includes('ground')) return false;
    return true;
  }

  async inflictStatus(t, st, src) {
    const mon = this.sides[t].mon;
    const code = { b: 'brn', p: 'par', s: 'psn', t: 'tox', z: 'slp', f: 'frz' }[st] || st;
    mon.status = code;
    if (code === 'slp') mon.sleepTurns = 1 + rnd(3);
    if (code === 'tox') mon.toxN = 1;
    const txt = { brn: 'foi queimado!', par: 'ficou paralisado! Talvez não consiga se mover!', psn: 'foi envenenado!', tox: 'foi gravemente envenenado!', slp: 'adormeceu!', frz: 'foi congelado!' }[code];
    await this.ui.statusAnim(this, t, code);
    await this.ui.msg(`${this.label(t)} ${txt}`);
  }

  async applyBoosts(s, b, self = true) {
    const sd = this.sides[s];
    for (const [k, v] of Object.entries(b)) {
      const cur = sd.boosts[k];
      const nxt = clamp(cur + v, -6, 6);
      if (nxt === cur) {
        await this.ui.msg(`${STAT_PT[k]} de ${this.label(s)} não vai ${v > 0 ? 'subir' : 'cair'} mais!`);
        continue;
      }
      sd.boosts[k] = nxt;
      await this.ui.statAnim(this, s, v > 0);
      const d = Math.abs(nxt - cur);
      const word = v > 0 ? (d >= 3 ? 'subiu drasticamente' : d === 2 ? 'subiu muito' : 'subiu') : (d >= 3 ? 'caiu drasticamente' : d === 2 ? 'caiu muito' : 'caiu');
      await this.ui.msg(`${STAT_PT[k]} de ${this.label(s)} ${word}!`);
    }
  }

  // Antes de agir: sono, congelamento, paralisia, confusão, recuo.
  async canAct(s, mv) {
    const sd = this.sides[s], mon = sd.mon, ui = this.ui;
    if (TRUANT.has(mon.id) && !sd.vol.transform) {
      sd.vol.loaf = !sd.vol.loaf;
      if (!sd.vol.loaf) { await ui.msg(`${this.label(s)} está com preguiça!`); return false; }
    }
    if (mon.status === 'slp') {
      if (mon.sleepTurns > 0) {
        mon.sleepTurns--;
        await ui.statusAnim(this, s, 'slp');
        await ui.msg(`${this.label(s)} está dormindo profundamente.`);
        return false;
      }
      mon.status = null;
      ui.refresh(this);
      await ui.msg(`${this.label(s)} acordou!`);
    }
    if (mon.status === 'frz') {
      if (chance(0.2) || (mv && (mv.id === 'flamewheel' || mv.id === 'sacredfire' || mv.id === 'flareblitz' || mv.id === 'scald' || mv.id === 'pyroball'))) {
        mon.status = null; ui.refresh(this);
        await ui.msg(`${this.label(s)} descongelou!`);
      } else {
        await ui.statusAnim(this, s, 'frz');
        await ui.msg(`${this.label(s)} está congelado e não consegue se mexer!`);
        return false;
      }
    }
    if (sd.vol.flinch) { sd.vol.flinch = false; await ui.msg(`${this.label(s)} recuou e não conseguiu agir!`); return false; }
    if (sd.vol.confusion) {
      sd.vol.confusion--;
      if (sd.vol.confusion <= 0) { delete sd.vol.confusion; await ui.msg(`${this.label(s)} não está mais confuso!`); }
      else {
        await ui.statusAnim(this, s, 'confusion');
        await ui.msg(`${this.label(s)} está confuso!`);
        if (chance(1 / 3)) {
          const a = this.stat(s, 'atk'), d = this.stat(s, 'def');
          const dmg = Math.max(1, Math.floor(Math.floor(Math.floor((2 * mon.level) / 5 + 2) * 40 * a / d) / 50) + 2);
          await ui.msg('Ele se machucou na confusão!', { noWait: true });
          await this.damage(s, dmg, { anim: true });
          return false;
        }
      }
    }
    if (mon.status === 'par' && chance(0.25)) {
      await ui.statusAnim(this, s, 'par');
      await ui.msg(`${this.label(s)} está paralisado! Não consegue se mexer!`);
      return false;
    }
    return true;
  }

  async damage(s, amount, opts = {}) {
    const mon = this.sides[s].mon;
    const from = curHp(mon);
    const dmg = Math.min(from, Math.max(0, Math.floor(amount)));
    mon.hpLost += dmg;
    if (opts.anim) await this.ui.hit(this, s, opts.eff ?? 1, opts.crit);
    await this.ui.hp(this, s, from, curHp(mon));
    return dmg;
  }

  async heal(s, amount) {
    const mon = this.sides[s].mon;
    const from = curHp(mon);
    mon.hpLost = Math.max(0, mon.hpLost - Math.floor(amount));
    if (curHp(mon) !== from) await this.ui.hp(this, s, from, curHp(mon));
    return curHp(mon) - from;
  }

  async useMove(s, mv, slot, forced) {
    const ui = this.ui;
    const t = this.other(s);
    const me = this.sides[s], tg = this.sides[t];
    if (!(await this.canAct(s, mv))) {
      if (me.vol.charging) { delete me.vol.charging; delete me.vol.invulnerable; }
      return;
    }
    // Sem PP em nenhum golpe: Luta.
    if (!forced && mv.id === 'struggle') await ui.msg(`${this.label(s)} não tem mais golpes!`);
    if (slot && !forced) slot.pp = Math.max(0, slot.pp - 1);
    me.vol.lastMove = mv.id;

    // Golpes de dois turnos
    if (mv.e.f && mv.e.f.includes('c') && !me.vol.charging) {
      me.vol.charging = mv.id;
      if (SEMI_INV.has(mv.id)) me.vol.invulnerable = true;
      await ui.msg(`${this.label(s)} usou ${mv.name.toUpperCase()}!`, { noWait: true });
      await ui.chargeAnim(this, s, mv);
      await ui.msg(`${this.label(s)} ${CHARGE_TEXT[mv.id] || 'está se preparando!'}`);
      if (mv.id === 'skullbash') await this.applyBoosts(s, { def: 1 });
      return;
    }
    const wasCharging = !!me.vol.charging;
    delete me.vol.charging; delete me.vol.invulnerable;

    await ui.msg(`${this.label(s)} usou ${mv.name.toUpperCase()}!`, { noWait: true });

    // Metrônomo: escolhe outro golpe.
    if (mv.id === 'metronome') {
      const pool = Object.values(MOVES).filter((m) => m.cat !== 'status' && m.bp > 0 && !(m.e.f && m.e.f.includes('c')) && m.id !== 'struggle');
      mv = pick(pool);
      await ui.msg(`Saiu ${mv.name.toUpperCase()}!`, { noWait: true });
    }

    // Golpes de status ------------------------------------------------
    if (mv.cat === 'status') { await this.statusMove(s, mv); return; }

    // Golpes de dano --------------------------------------------------
    if (['fakeout', 'firstimpression'].includes(mv.id) && !me.vol.firstTurn) { await ui.msg('Mas falhou!'); return; }
    if (['suckerpunch', 'thunderclap'].includes(mv.id)) {
      const ta = this.turnActs[t];
      const tmv = ta && ta.type === 'move' ? this.actionMove(t, ta) : null;
      if (!tmv || tmv.cat === 'status' || this.moved[t]) { await ui.msg('Mas falhou!'); return; }
    }
    if (mv.id === 'dreameater' && tg.mon.status !== 'slp') { await ui.msg(`Não afetou ${this.label(t)}...`); return; }
    if (mv.id === 'focuspunch' && this.hitThisTurn[s]) { await ui.msg(`${this.label(s)} perdeu a concentração e não conseguiu agir!`); return; }
    if (['counter', 'mirrorcoat'].includes(mv.id)) {
      const h = this.hitThisTurn[s];
      const need = mv.id === 'counter' ? 'phys' : 'spec';
      if (!h || h.cat !== need || h.amount <= 0) { await ui.msg('Mas falhou!'); return; }
      if (tg.vol.protect) { await ui.msg(`${this.label(t)} se protegeu!`); return; }
      await ui.attackAnim(this, s, mv);
      await this.damage(t, h.amount * 2, { anim: true });
      await this.afterDamageChecks(s, t);
      return;
    }
    if (tg.vol.protect) { await ui.msg(`${this.label(t)} se protegeu!`); return; }
    if (tg.vol.invulnerable) { await ui.msg(`${this.label(s)} errou o ataque!`); return; }

    // Precisão
    if (!this.hits(s, t, mv)) {
      await ui.msg(`${this.label(s)} errou o ataque!`);
      if (mv.e.cd) { await ui.msg(`${this.label(s)} caiu e se machucou!`); await this.damage(s, maxHp(me.mon) / 2, { anim: true }); await this.afterDamageChecks(s, t); }
      if (['explosion', 'selfdestruct'].includes(mv.id)) { await this.damage(s, curHp(me.mon)); }
      return;
    }

    // Efetividade 0
    const eff0 = mv.typeless ? 1 : typeEff(mv.type, this.typesOf(t), mv.id);
    if (eff0 === 0 && !mv.e.dm && !['superfang', 'naturesmadness', 'ruination', 'endeavor'].includes(mv.id)) {
      await ui.msg(`Não afeta ${this.label(t)}...`);
      return;
    }
    if (eff0 === 0 && mv.e.dm) { await ui.msg(`Não afeta ${this.label(t)}...`); return; }
    if (mv.type === 'ground' && mv.id !== 'thousandarrows' && LEVITATE.has(tg.mon.id) && !tg.vol.transform) { await ui.msg(`${this.label(t)} está flutuando! Não foi afetado...`); return; }
    if (tg.mon.id === WONDER_GUARD && !tg.vol.transform && !mv.typeless && eff0 <= 1 && !mv.e.dm) { await ui.msg(`Não afeta ${this.label(t)}... (Guarda Maravilhosa)`); return; }

    // Número de golpes
    let hits = 1;
    if (mv.e.mh) {
      if (Array.isArray(mv.e.mh)) { const r = Math.random(); hits = r < 0.35 ? 2 : r < 0.7 ? 3 : r < 0.85 ? 4 : 5; }
      else hits = mv.e.mh;
      if (mv.id === 'populationbomb') { hits = 1; while (hits < 10 && chance(0.9)) hits++; }
    }
    await ui.attackAnim(this, s, mv);
    let total = 0, landed = 0, lastEff = 1, anyCrit = false;
    for (let h = 0; h < hits; h++) {
      if (curHp(tg.mon) <= 0) break;
      const r = this.calcDamage(s, t, mv, { hitIndex: h });
      if (r.damage <= 0) break;
      lastEff = r.eff; anyCrit = anyCrit || r.crit;
      let dmg = r.damage;
      if (mv.id === 'falseswipe') dmg = Math.min(dmg, curHp(tg.mon) - 1);
      const done = await this.damage(t, dmg, { anim: true, eff: r.eff, crit: r.crit });
      total += done; landed++;
      this.hitThisTurn[t] = { amount: done, cat: mv.cat };
      tg.vol.timesHit = (tg.vol.timesHit || 0) + 1;
      if (r.crit) { await ui.msg('Um golpe crítico!'); this.stats.crits++; if (r.eff > 1 && s === 'p') this.stats.superCrit = true; }
    }
    if (hits > 1) await ui.msg(`Acertou ${landed} ${landed === 1 ? 'vez' : 'vezes'}!`);
    if (lastEff > 1) await ui.msg('É super efetivo!');
    else if (lastEff < 1 && lastEff > 0) await ui.msg('Não é muito efetivo...');

    // Depois do dano
    if (total > 0) {
      if (mv.e.dr) {
        const amt = Math.max(1, Math.floor(total * mv.e.dr));
        if (curHp(me.mon) > 0 && curHp(me.mon) < maxHp(me.mon)) { await this.heal(s, amt); await ui.msg(`${this.label(t)} teve sua energia drenada!`); }
      }
      if (mv.e.rc && curHp(me.mon) > 0) {
        await this.damage(s, Math.max(1, Math.floor(total * mv.e.rc)));
        await ui.msg(`${this.label(s)} foi atingido pelo recuo!`);
      }
      if (mv.id === 'struggle' && curHp(me.mon) > 0) {
        await this.damage(s, Math.max(1, Math.floor(maxHp(me.mon) / 4)));
        await ui.msg(`${this.label(s)} foi atingido pelo recuo!`);
      }
      if (mv.id === 'wakeupslap' && tg.mon.status === 'slp' && curHp(tg.mon) > 0) { tg.mon.status = null; ui.refresh(this); await ui.msg(`${this.label(t)} acordou!`); }
      if (mv.id === 'clearsmog' && curHp(tg.mon) > 0) { tg.boosts = this.zeroBoosts(); await ui.msg(`Os atributos de ${this.label(t)} voltaram ao normal!`); }
      if (mv.e.th && tg.mon.status === 'frz') { tg.mon.status = null; ui.refresh(this); await ui.msg(`${this.label(t)} descongelou!`); }
      if (mv.type === 'fire' && tg.mon.status === 'frz' && curHp(tg.mon) > 0) { tg.mon.status = null; ui.refresh(this); await ui.msg(`${this.label(t)} descongelou!`); }
      // Efeitos secundários
      if (curHp(tg.mon) > 0) await this.secondaries(s, t, mv);
      else if (mv.e.s) { for (const sec of mv.e.s) if (sec.sb && chance((sec.c || 100) / 100)) await this.applyBoosts(s, sec.sb); }
      if (mv.e.sf && curHp(me.mon) > 0) await this.applyBoosts(s, mv.e.sf);
      if (mv.e.v === 'pt' && curHp(tg.mon) > 0 && !tg.vol.trapped) {
        tg.vol.trapped = 4 + rnd(2);
        await ui.msg(`${this.label(t)} ficou preso!`);
      }
      if (mv.e.f && mv.e.f.includes('r') && curHp(me.mon) > 0) me.vol.recharge = true;
    }
    if (['explosion', 'selfdestruct'].includes(mv.id) && curHp(me.mon) > 0) await this.damage(s, curHp(me.mon));
    await this.afterDamageChecks(s, t);
  }

  async afterDamageChecks() { /* desmaios são tratados no fim do turno */ }

  hits(s, t, mv) {
    if (mv.acc === true) return true;
    const a = this.sides[s].boosts.accuracy - this.sides[t].boosts.evasion;
    const p = (mv.acc / 100) * ACC_MULT(clamp(a, -6, 6));
    return Math.random() < p;
  }

  calcDamage(s, t, mv, o = {}) {
    const me = this.sides[s], tg = this.sides[t];
    const L = me.mon.level;
    const tgMon = tg.mon;
    // Dano fixo
    if (mv.e.dm) return { damage: mv.e.dm === 'level' ? L : mv.e.dm, eff: 1, crit: false };
    if (['superfang', 'naturesmadness', 'ruination'].includes(mv.id)) return { damage: Math.max(1, Math.floor(curHp(tgMon) / 2)), eff: 1, crit: false };
    if (mv.id === 'endeavor') return { damage: Math.max(0, curHp(tgMon) - curHp(me.mon)), eff: 1, crit: false };

    let bp = mv.bp;
    const myFrac = curHp(me.mon) / maxHp(me.mon);
    switch (mv.id) {
      case 'flail': case 'reversal': { const r = Math.floor((48 * curHp(me.mon)) / maxHp(me.mon)); bp = r <= 1 ? 200 : r <= 4 ? 150 : r <= 9 ? 100 : r <= 16 ? 80 : r <= 32 ? 40 : 20; break; }
      case 'eruption': case 'waterspout': bp = Math.max(1, Math.floor(150 * myFrac)); break;
      case 'crushgrip': case 'wringout': bp = Math.max(1, Math.floor((120 * curHp(tgMon)) / maxHp(tgMon))); break;
      case 'gyroball': bp = Math.min(150, Math.floor((25 * this.stat(t, 'spe')) / this.stat(s, 'spe')) + 1); break;
      case 'electroball': { const r = this.stat(s, 'spe') / this.stat(t, 'spe'); bp = r >= 4 ? 150 : r >= 3 ? 120 : r >= 2 ? 80 : r >= 1 ? 60 : 40; break; }
      case 'triplekick': bp = 10 * ((o.hitIndex || 0) + 1); break;
      case 'payback': bp = this.moved && this.moved[t] ? 100 : 50; break;
      case 'avalanche': case 'revenge': bp = this.hitThisTurn && this.hitThisTurn[s] ? 120 : 60; break;
      case 'assurance': bp = this.hitThisTurn && this.hitThisTurn[t] ? 120 : 60; break;
      case 'hex': bp = tgMon.status ? 130 : 65; break;
      case 'venoshock': bp = tgMon.status === 'psn' || tgMon.status === 'tox' ? 130 : 65; break;
      case 'brine': bp = curHp(tgMon) * 2 <= maxHp(tgMon) ? 130 : 65; break;
      case 'facade': bp = ['brn', 'par', 'psn', 'tox'].includes(me.mon.status) ? 140 : 70; break;
      case 'storedpower': case 'powertrip': bp = 20 + 20 * Object.values(me.boosts).filter((v) => v > 0).reduce((a, b) => a + b, 0); break;
      case 'ragefist': bp = Math.min(350, 50 + 50 * (me.vol.timesHit || 0)); break;
      case 'boltbeak': case 'fishiousrend': bp = !this.moved || !this.moved[t] ? 170 : 85; break;
      case 'wakeupslap': bp = tgMon.status === 'slp' ? 140 : 70; break;
      default: if (mv.id in CALLBACK_BP) bp = CALLBACK_BP[mv.id];
    }
    if (o.estimate && mv.e.mh) bp = bp * (Array.isArray(mv.e.mh) ? 3 : mv.e.mh);

    // Crítico
    let cs = (mv.e.cr ? mv.e.cr - 1 : 0) + (me.vol.focusenergy ? 2 : 0);
    const crit = !o.estimate && (mv.e.wc || chance([1 / 16, 1 / 8, 1 / 2, 1][Math.min(3, cs)]));
    const phys = mv.cat === 'phys';
    const ignoreDef = !!mv.e.id;
    let A, D;
    if (mv.id === 'foulplay') A = this.stat(t, 'atk', crit, false);
    else if (mv.e.os === 'def') A = this.stat(s, 'def', crit, false);
    else A = this.stat(s, phys ? 'atk' : 'spa', crit, false);
    const dKey = mv.e.ds === 'def' ? 'def' : phys ? 'def' : 'spd';
    D = ignoreDef ? this.rawStat(t, dKey) : this.stat(t, dKey, false, crit);
    let dmg = Math.floor(Math.floor((Math.floor((2 * L) / 5 + 2) * bp * A) / D) / 50) + 2;
    if (crit) dmg = Math.floor(dmg * 1.5);
    dmg = Math.floor(dmg * (o.estimate ? 0.92 : (85 + rnd(16)) / 100));
    const myTypes = this.typesOf(s);
    if (!mv.typeless && myTypes.includes(mv.type)) dmg = Math.floor(dmg * 1.5);
    const eff = mv.typeless ? 1 : typeEff(mv.type, this.typesOf(t), mv.id);
    dmg = Math.floor(dmg * eff);
    if (phys && me.mon.status === 'brn' && mv.id !== 'facade') dmg = Math.floor(dmg / 2);
    if (!crit && ((phys && tg.screens.reflect) || (!phys && tg.screens.light))) dmg = Math.floor(dmg / 2);
    if (eff > 0) dmg = Math.max(1, dmg);
    return { damage: dmg, eff, crit };
  }

  async secondaries(s, t, mv) {
    const tg = this.sides[t];
    const list = mv.e.s || [];
    for (const sec of list) {
      if (!chance((sec.c || 100) / 100)) continue;
      if (sec.st) {
        if (mv.id === 'triattack') continue;
        if (this.canStatus(t, sec.st)) await this.inflictStatus(t, sec.st);
      }
      if (sec.v === 'fl') { if (this.order && this.order[0] === s && !this.moved[t]) tg.vol.flinch = true; }
      if (sec.v === 'cf' && !tg.vol.confusion) { tg.vol.confusion = 2 + rnd(4); await this.ui.statusAnim(this, t, 'confusion'); await this.ui.msg(`${this.label(t)} ficou confuso!`); }
      if (sec.v === 'saltcure' && !tg.vol.saltcure) { tg.vol.saltcure = true; await this.ui.msg(`${this.label(t)} está sendo curtido no sal!`); }
      if (sec.v === 'syrupbomb' && !tg.vol.syrup) { tg.vol.syrup = 3; await this.ui.msg(`${this.label(t)} ficou coberto de xarope!`); }
      if (sec.v === 'sparklingaria' && tg.mon.status === 'brn') { tg.mon.status = null; this.ui.refresh(this); await this.ui.msg(`A queimadura de ${this.label(t)} foi curada!`); }
      if (sec.b) await this.applyBoosts(t, sec.b);
      if (sec.sb) await this.applyBoosts(s, sec.sb);
    }
    if (mv.id === 'triattack' && chance(0.2)) {
      const st = pick(['b', 'p', 'f']);
      if (this.canStatus(t, st)) await this.inflictStatus(t, st);
    }
  }

  async statusMove(s, mv) {
    const ui = this.ui, t = this.other(s);
    const me = this.sides[s], tg = this.sides[t];
    const e = mv.e;
    const onlyRaises = e.b && !e.v && !e.st && Object.values(e.b).every((v) => v > 0);
    const self = e.tg === 's' || onlyRaises || ['lightscreen', 'reflect', 'haze', 'healbell', 'aromatherapy', 'bellydrum', 'rest', 'wish',
      'synthesis', 'moonlight', 'morningsun', 'shoreup', 'lifedew', 'swallow', 'psychup', 'splash', 'celebrate', 'teleport', 'protect', 'detect', 'curse'].includes(mv.id);
    if (!self) {
      if (tg.vol.protect) { await ui.msg(`${this.label(t)} se protegeu!`); return; }
      if (tg.vol.invulnerable) { await ui.msg(`${this.label(s)} errou!`); return; }
      if (!this.hits(s, t, mv)) { await ui.msg(`${this.label(s)} errou!`); return; }
    }
    await ui.statusMoveAnim(this, s, mv, self);
    switch (mv.id) {
      case 'splash': case 'celebrate': await ui.msg('Mas nada aconteceu!'); return;
      case 'teleport':
        if (this.wild) {
          await ui.msg(`${this.label(s)} se teletransportou para longe!`);
          this.result = s === 'p' ? 'run' : 'fled';
        } else await ui.msg('Mas falhou!');
        return;
      case 'protect': case 'detect': {
        const n = me.vol.protectCount || 0;
        if (n && !chance(Math.pow(1 / 3, n))) { me.vol.protectCount = 0; await ui.msg('Mas falhou!'); return; }
        me.vol.protect = true; me.vol.protectCount = n + 1;
        await ui.msg(`${this.label(s)} se protegeu!`);
        return;
      }
      case 'reflect': case 'lightscreen': {
        const k = mv.id === 'reflect' ? 'reflect' : 'light';
        if (me.screens[k]) { await ui.msg('Mas falhou!'); return; }
        me.screens[k] = 5;
        await ui.msg(mv.id === 'reflect' ? 'Reflexo aumentou a resistência a golpes físicos!' : 'Tela de Luz aumentou a resistência a golpes especiais!');
        return;
      }
      case 'haze': this.sides.p.boosts = this.zeroBoosts(); this.sides.e.boosts = this.zeroBoosts(); await ui.msg('Todas as mudanças de atributos foram eliminadas!'); return;
      case 'psychup': me.boosts = { ...tg.boosts }; await ui.msg(`${this.label(s)} copiou as mudanças de atributos de ${this.label(t)}!`); return;
      case 'healbell': case 'aromatherapy': {
        const list = s === 'p' ? this.party : this.enemy;
        list.forEach((p) => { p.status = null; });
        ui.refresh(this);
        await ui.msg('Os problemas de status da equipe foram curados!');
        return;
      }
      case 'bellydrum':
        if (curHp(me.mon) <= maxHp(me.mon) / 2 || me.boosts.atk >= 6) { await ui.msg('Mas falhou!'); return; }
        await this.damage(s, maxHp(me.mon) / 2);
        me.boosts.atk = 6;
        await ui.statAnim(this, s, true);
        await ui.msg(`${this.label(s)} cortou o próprio HP e maximizou o Ataque!`);
        return;
      case 'rest':
        if (curHp(me.mon) === maxHp(me.mon)) { await ui.msg('Mas falhou!'); return; }
        me.mon.status = 'slp'; me.mon.sleepTurns = 2;
        await this.heal(s, maxHp(me.mon));
        ui.refresh(this);
        await ui.msg(`${this.label(s)} dormiu e recuperou a energia!`);
        return;
      case 'synthesis': case 'moonlight': case 'morningsun': case 'shoreup': case 'wish': case 'recover': case 'softboiled': case 'milkdrink': case 'slackoff': case 'roost': case 'lifedew': {
        const frac = mv.id === 'lifedew' ? 0.25 : 0.5;
        if (curHp(me.mon) === maxHp(me.mon)) { await ui.msg('Mas o HP já está cheio!'); return; }
        await this.heal(s, maxHp(me.mon) * frac);
        await ui.msg(`${this.label(s)} recuperou HP!`);
        return;
      }
      case 'swallow': await ui.msg('Mas falhou!'); return;
      case 'strengthsap': {
        if (tg.boosts.atk <= -6) { await ui.msg('Mas falhou!'); return; }
        const amt = this.stat(t, 'atk');
        await this.applyBoosts(t, { atk: -1 });
        await this.heal(s, amt);
        await ui.msg(`${this.label(s)} drenou a força de ${this.label(t)}!`);
        return;
      }
      case 'painsplit': {
        const avg = Math.floor((curHp(me.mon) + curHp(tg.mon)) / 2);
        const a0 = curHp(me.mon), b0 = curHp(tg.mon);
        me.mon.hpLost = Math.max(0, maxHp(me.mon) - Math.min(maxHp(me.mon), avg));
        tg.mon.hpLost = Math.max(0, maxHp(tg.mon) - Math.min(maxHp(tg.mon), avg));
        await ui.hp(this, s, a0, curHp(me.mon)); await ui.hp(this, t, b0, curHp(tg.mon));
        await ui.msg('Os dois dividiram a dor!');
        return;
      }
      case 'curse':
        if (this.typesOf(s).includes('ghost')) {
          if (tg.vol.curse) { await ui.msg('Mas falhou!'); return; }
          await this.damage(s, maxHp(me.mon) / 2);
          tg.vol.curse = true;
          await ui.msg(`${this.label(s)} cortou o próprio HP e amaldiçoou ${this.label(t)}!`);
        } else await this.applyBoosts(s, { atk: 1, def: 1, spe: -1 });
        return;
      case 'transform': {
        if (me.vol.transform || tg.vol.transform) { await ui.msg('Mas falhou!'); return; }
        const tStats = [0, 1, 2, 3, 4, 5].map((i) => (i === 0 ? 0 : this.rawStat(t, STAT_KEYS[i])));
        me.vol.transform = { id: tg.mon.id, types: this.typesOf(t).slice(), stats: tStats, moves: this.movesOf(t).map((m) => ({ id: m.id, pp: 5, maxpp: 5 })) };
        me.boosts = { ...tg.boosts };
        await ui.transformAnim(this, s);
        await ui.msg(`${this.label(s)} se transformou em ${NAME(tg.mon)}!`);
        return;
      }
    }
    // Genéricos
    let did = false;
    if (e.st) {
      if (!this.canStatus(t, e.st, mv.id)) {
        if (tg.mon.status) await ui.msg(`${this.label(t)} já está com um problema de status!`);
        else await ui.msg(`Não afeta ${this.label(t)}...`);
      } else { await this.inflictStatus(t, e.st); did = true; }
    }
    if (e.b) { await this.applyBoosts(self ? s : t, e.b); did = true; }
    if (e.v === 'cf') {
      if (tg.vol.confusion) await ui.msg(`${this.label(t)} já está confuso!`);
      else { tg.vol.confusion = 2 + rnd(4); await ui.statusAnim(this, t, 'confusion'); await ui.msg(`${this.label(t)} ficou confuso!`); }
      did = true;
    }
    if (e.v === 'leechseed') {
      if (tg.vol.leechseed || this.typesOf(t).includes('grass')) await ui.msg(`Não afeta ${this.label(t)}...`);
      else { tg.vol.leechseed = true; await ui.msg(`${this.label(t)} foi semeado!`); }
      did = true;
    }
    if (e.v === 'focusenergy') { me.vol.focusenergy = true; await ui.msg(`${this.label(s)} está se concentrando!`); did = true; }
    if (e.v === 'aquaring' || e.v === 'ingrain') { me.vol.regen = true; await ui.msg(e.v === 'ingrain' ? `${this.label(s)} criou raízes!` : `${this.label(s)} se cercou de um véu de água!`); did = true; }
    if (e.hl && !did) {
      if (curHp(me.mon) === maxHp(me.mon)) await ui.msg('Mas o HP já está cheio!');
      else { await this.heal(s, maxHp(me.mon) * e.hl); await ui.msg(`${this.label(s)} recuperou HP!`); }
      did = true;
    }
    if (!did) await ui.msg('Mas nada aconteceu!');
  }

  // ---------- fim do turno ----------
  async endOfTurn() {
    const ui = this.ui;
    for (const s of ['p', 'e']) {
      const sd = this.sides[s];
      sd.vol.protect = false; sd.vol.flinch = false;
      if (this.turnActs && this.turnActs[s] && this.turnActs[s].type === 'move') {
        const mv = this.actionMove(s, this.turnActs[s]);
        if (mv && mv.id !== 'protect' && mv.id !== 'detect') sd.vol.protectCount = 0;
      }
      for (const k of ['reflect', 'light']) {
        if (sd.screens[k] > 0 && --sd.screens[k] === 0) await ui.msg(`${k === 'reflect' ? 'O Reflexo' : 'A Tela de Luz'} de ${s === 'p' ? 'sua equipe' : 'seu oponente'} acabou.`);
      }
    }
    for (const s of this.order || ['p', 'e']) {
      const sd = this.sides[s], mon = sd.mon;
      if (!mon || curHp(mon) <= 0) continue;
      const M = maxHp(mon);
