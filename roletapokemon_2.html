  setTextLines(lines, narrow = false) {
    const cv = mkCanvas(GW, 48), c = cv.getContext('2d');
    lines.slice(0, 2).forEach((l, i) => {
      const maxW = narrow ? 102 : 216;
      const sp = measureText(l) > maxW ? 0 : null;
      drawText(c, l, 11, 4 + i * 16, { color: GP.light, shadow: GP.lightSh, spacing: sp });
    });
    this.s.text = { lines, cv, arrow: false, narrow };
  }
  async msg(text, opts = {}) {
    const snd = opts.sound === 'level' ? 'levelUp' : opts.sound;
    if (snd && Sound[snd]) Sound[snd]();
    this.closeMenus();
    const lines = wrapText(String(text), 214);
    const d = this.charDelay;
    // Mostra de 2 em 2 linhas, rolando como no GBA.
    for (let start = 0; start < lines.length; start += start === 0 ? 2 : 1) {
      const view = lines.slice(Math.max(0, start === 0 ? 0 : start - 1), start === 0 ? 2 : start + 1);
      const full = view.join('\n');
      const prefixLen = start === 0 ? 0 : view[0].length + 1;
      if (d && !this.auto) {
        let skip = false;
        this.typing = true;
        const prev = this.keyHandler;
        this.keyHandler = (b) => { if (b === 'A' || b === 'B') skip = true; };
        for (let i = prefixLen; i <= full.length && !skip; i++) {
          this.setTextLines(full.slice(0, i).split('\n'));
          if (full[i - 1] !== ' ') { if (i % 3 === 0) Sound.tick(); }
          await sleep(d);
        }
        this.keyHandler = prev;
        this.typing = false;
      }
      this.setTextLines(view);
      const last = start + (start === 0 ? 2 : 1) >= lines.length;
      if (last && opts.noWait) { await sleep(this.dur(this.auto ? 380 : 300)); return; }
      if (this.auto) { await sleep(this.dur(650)); continue; }
      this.s.text.arrow = true;
      await new Promise((r) => { this.waiter = r; });
      this.s.text.arrow = false;
      Sound.blip();
    }
  }
  closeMenus() { this.s.menu = null; this.keyHandler = null; this.tapHandler = null; }

  // Seleção genérica: setas/A/B e toque em retângulos.
  select({ n, cols = 1, start = 0, rects = null, onPick, onBack, onMove, disabled = () => false, state = {} }) {
    const st = state;
    st.cur = Math.max(0, Math.min(start, n - 1));
    const move = (nx) => { if (nx !== st.cur && nx >= 0 && nx < n) { st.cur = nx; Sound.cursor(); if (onMove) onMove(nx); } };
    this.keyHandler = (b) => {
      if (b === 'A') { if (disabled(st.cur)) { Sound.bad(); return; } Sound.blip(); onPick(st.cur); return; }
      if (b === 'B') { if (onBack) { Sound.blip(); onBack(); } return; }
      const r = Math.floor(st.cur / cols), col = st.cur % cols;
      if (b === 'L' && col > 0) move(st.cur - 1);
      if (b === 'R' && col < cols - 1 && st.cur + 1 < n) move(st.cur + 1);
      if (b === 'U' && r > 0) move(st.cur - cols);
      if (b === 'D' && st.cur + cols < n) move(st.cur + cols);
    };
    this.tapHandler = rects ? (x, y) => {
      const i = rects.findIndex((q) => q && x >= q[0] && x < q[0] + q[2] && y >= q[1] && y < q[1] + q[3]);
      if (i < 0) return false;
      if (i !== st.cur) { st.cur = i; if (onMove) onMove(i); }
      this.keyHandler('A');
      return true;
    } : null;
    if (onMove) onMove(st.cur);
    return st;
  }

  // ---------- menus da batalha ----------
  chooseAction(b) {
    this.battle = b;
    return new Promise((resolve) => {
      this.pendingChoice = resolve;
      const done = (act) => { this.pendingChoice = null; this.closeMenus(); resolve(act); };
      const mon = b.sides.p.mon;
      const showMain = (start = this.lastAct || 0) => {
        this.closeMenus();
        const nm = NAME(mon);
        this.setTextLines([`O que ${nm}`, 'vai fazer?'], true);
        const menu = { kind: 'action', labels: ['LUTAR', 'BOLSA', 'POKéMON', 'FUGIR'], cur: 0 };
        this.s.menu = menu;
        this.select({ n: 4, cols: 2, start, state: menu, rects: [[128, 116, 52, 16], [180, 116, 56, 16], [128, 132, 52, 16], [180, 132, 56, 16]],
          onPick: (i) => {
            this.lastAct = i;
            if (i === 0) showMoves();
            else if (i === 1) this.bagMenu(b).then((r) => (r ? done(r) : showMain(1)));
            else if (i === 2) this.partyMenu(b, false).then((r) => (r != null ? done({ type: 'switch', index: r }) : showMain(2)));
            else done({ type: 'run' });
          } });
      };
      const showMoves = () => {
        const moves = b.movesOf('p');
        if (!moves.some((m) => m.pp > 0)) { done({ type: 'move', index: -1 }); return; }
        const items = [0, 1, 2, 3].map((i) => ({ m: moves[i] || null }));
        const menu = { kind: 'moves', items, cur: 0 };
        this.s.menu = menu;
        this.select({ n: 4, cols: 2, start: this.lastMove || 0, state: menu, disabled: (i) => !items[i].m,
          rects: [[8, 116, 72, 16], [80, 116, 78, 16], [8, 132, 72, 16], [80, 132, 78, 16]],
          onPick: (i) => {
            if (items[i].m.pp <= 0) { Sound.bad(); this.closeMenus(); this.msg('Não há PP sobrando para este golpe!').then(showMoves); return; }
            this.lastMove = i;
            done({ type: 'move', index: i });
          },
          onBack: () => showMain(0) });
      };
      showMain();
    });
  }
  yesNo(text) {
    return new Promise(async (resolve) => {
      await this.msg(text, { noWait: true });
      if (this.auto) { resolve(true); return; }
      const menu = { kind: 'yesno', cur: 0 };
      this.s.menu = menu;
      const finish = (v) => { this.closeMenus(); resolve(v); };
      this.select({ n: 2, state: menu, rects: [[176, 74, 64, 16], [176, 90, 64, 16]], onPick: (i) => finish(i === 0), onBack: () => finish(false) });
    });
  }
  async learnMove(b, mon, mid) {
    const mv = MOVES[mid];
    await this.msg(`${NAME(mon)} quer aprender ${mv.name.toUpperCase()}.`);
    await this.msg(`Mas ${NAME(mon)} já conhece 4 golpes.`);
    const yes = await this.yesNo(`Esquecer um golpe para aprender ${mv.name.toUpperCase()}?`);
    if (!yes) return -1;
    const idx = await this.moveListScreen(mon, mid);
    return idx;
  }
  chooseReplacement(b) { return this.partyMenu(b, true); }
  consumeItem(key) { if (this.onConsume) this.onConsume(key); }

  // ---------- tela da equipe (estilo GBA) ----------
  partyMenu(b, forced, purpose = 'switch') {
    return new Promise((resolve) => {
      const party = b.party;
      const active = b.sides.p.mon;
      const title = purpose === 'item' ? 'Usar em qual POKéMON?' : forced ? 'Escolha o próximo POKéMON.' : 'Escolha um POKéMON.';
      const scr = { kind: 'party', cur: Math.max(0, party.indexOf(active)), msg: title, warn: 0, n: party.length };
      const prevScreen = this.s.screen;
      const finish = (v) => { this.s.screen = prevScreen; this.keyHandler = null; this.tapHandler = null; resolve(v); };
      const warn = (t) => { scr.msg = t; scr.warn = 1; Sound.bad(); clearTimeout(scr.wt); scr.wt = setTimeout(() => { scr.msg = title; scr.warn = 0; }, 1500); };
      const pick = (i) => {
        if (i === 6) { if (!forced) finish(null); return; }
        const m = party[i];
        if (!m) return;
        if (purpose === 'item') { finish(i); return; }
        if (curHp(m) <= 0) { warn(`${NAME(m)} não tem energia para lutar!`); return; }
        if (m === active) { warn(`${NAME(m)} já está lutando!`); return; }
        finish(i);
      };
      scr.draw = (c) => this.drawPartyScreen(c, scr, party, active, forced);
      this.s.screen = scr;
      const order = [0, 1, 2, 3, 4, 5, 6].filter((i) => i === 6 ? !forced : i < party.length);
      this.keyHandler = (k) => {
        const pos = order.indexOf(scr.cur);
        if (k === 'A') { Sound.blip(); pick(scr.cur); return; }
        if (k === 'B') { if (!forced) { Sound.blip(); finish(null); } return; }
        let np = scr.cur;
        if (k === 'U') np = order[(pos - 1 + order.length) % order.length];
        if (k === 'D') np = order[(pos + 1) % order.length];
        if (k === 'L' && scr.cur !== 0 && scr.cur !== 6) np = 0;
        if (k === 'R' && scr.cur === 0 && party.length > 1) np = scr.last || 1;
        if (np !== scr.cur) { if (scr.cur > 0 && scr.cur < 6) scr.last = scr.cur; scr.cur = np; Sound.cursor(); }
      };
      this.tapHandler = (x, y) => {
        let i = -1;
        if (x >= 4 && x < 86 && y >= 16 && y < 76) i = 0;
        for (let k = 1; k < 6; k++) if (x >= 86 && y >= 8 + (k - 1) * 24 && y < 8 + (k - 1) * 24 + 23) i = k;
        if (x >= 176 && y >= 130 && !forced) i = 6;
        if (i < 0 || (i < 6 && !party[i])) return false;
        scr.cur = i;
        Sound.blip();
        pick(i);
        return true;
      };
    });
  }
  drawPartyScreen(c, scr, party, active, forced) {
    if (!this.partyBg) {
      const bg = mkCanvas(GW, GH), g = bg.getContext('2d');
      rect(g, 0, 0, GW, GH, '#307068');
      for (let y = 0; y < GH; y++) for (let x = 0; x < GW; x++) if ((x + y * 2) % 10 < 2) rect(g, x, y, 1, 1, '#2a6460');
      this.partyBg = bg;
    }
    c.drawImage(this.partyBg, 0, 0);
    const t = this.s.tick;
    for (let i = 0; i < 6; i++) {
      const m = party[i];
      const sel = scr.cur === i;
      if (i === 0) this.drawSlot0(c, m, sel, t, m === active);
      else this.drawSlot(c, i, m, sel, t, m === active);
    }
    // mensagem e CANCELAR
    drawWhiteBox(c, 0, 128, forced ? 240 : 172, 32, scr.warn ? '#c84838' : '#5070a0');
    drawText(c, scr.msg, 9, 136, { color: GP.dark, shadow: GP.darkSh, spacing: measureText(scr.msg) > (forced ? 222 : 156) ? 0 : null });
    if (!forced) {
      const sel = scr.cur === 6;
      rrect(c, 176, 132, 60, 24, '#283850', 2);
      rrect(c, 177, 133, 58, 22, sel ? '#f89048' : '#4878c0', 2);
      rect(c, 179, 135, 54, 18, sel ? '#80c0f8' : '#5890d8');
      drawText(c, 'CANCELAR', 184, 135, { font: FS, color: '#f8f8f8', shadow: '#304860' });
    }
  }
  slotColors(m, sel) {
    if (!m) return { out: '#284850', fill: '#386070', hi: '#386070', text: '#80a0a8' };
    const dead = curHp(m) <= 0;
    if (sel) return { out: '#f86830', fill: dead ? '#f0a070' : '#88c8f8', hi: '#c8e8f8', text: '#f8f8f8' };
    return dead ? { out: '#602818', fill: '#c06038', hi: '#e08860', text: '#f8f8f8' } : { out: '#203868', fill: '#3878c8', hi: '#68a8e8', text: '#f8f8f8' };
  }
  drawIcon(c, m, x, y, sel, t) {
    const ic = this.iconCache && this.iconCache[m.id];
    if (ic === undefined) {
      this.iconCache = this.iconCache || {};
      this.iconCache[m.id] = null;
      getIcon(m.id).then((r) => { this.iconCache[m.id] = r; });
      return;
    }
    if (!ic) return;
    const speed = sel ? 8 : 16;
    const fr = ic.frames[Math.floor(t / speed) % ic.frames.length];
    const dead = curHp(m) <= 0;
    c.drawImage(dead ? silhouette(fr, '#806860') : fr, x, y - (sel && ic.frames.length < 2 && Math.floor(t / 8) % 2 ? 1 : 0));
  }
  drawSlot0(c, m, sel, t, isActive) {
    const x = 4, y = 18, w = 80, h = 56, col = this.slotColors(m, sel);
    rrect(c, x, y, w, h, col.out, 3);
    rrect(c, x + 2, y + 2, w - 4, h - 4, col.fill, 2);
    rect(c, x + 4, y + 3, w - 8, 1, col.hi);
    c.drawImage(ballSprite('pokeball'), x - 2, y - 6);
    if (!m) return;
    this.drawIcon(c, m, x + 2, y - 8, sel, t);
    this.drawSlotText(c, m, x + 34, y + 4, x + 38, y + 14, x + 70, x + 4, y + 32, x + w - 6, y + 36, col, 42);
    void isActive;
  }
  drawSlot(c, i, m, sel, t) {
    const x = 88, y = 8 + (i - 1) * 24, w = 148, h = 22, col = this.slotColors(m, sel);
    rrect(c, x, y, w, h, col.out, 3);
    rrect(c, x + 2, y + 2, w - 4, h - 4, col.fill, 2);
    rect(c, x + 4, y + 3, w - 8, 1, col.hi);
    if (!m) return;
    this.drawIcon(c, m, x - 4, y - 10, sel, t);
    this.drawSlotText(c, m, x + 28, y - 1, x + 32, y + 9, x + 66, x + 72, y + 2, x + w - 6, y + 6, col, 42);
  }
  drawSlotText(c, m, nx, ny, lx, ly, gx, bx, by, rx, ry, col, nameW = 42) {
    const sh = '#283848';
    drawText(c, NAME(m), nx, ny, { font: FS, color: col.text, shadow: sh, spacing: measureText(NAME(m), FS) > nameW ? 0 : null });
    const dead = curHp(m) <= 0;
    if (dead || m.status) {
      const k = dead ? 'fnt' : m.status;
      const [bg, fg] = STATUS_COLORS[k];
      rrect(c, lx, ly + 4, 20, 7, bg, 1);
      drawText(c, STATUS_TAG[k], lx + 3, ly, { font: FS, color: fg });
    } else drawText(c, `Nv${m.level}`, lx, ly, { font: FS, color: col.text, shadow: sh });
    if (m.gender === 'M') drawText(c, '♂', gx, ly, { font: FS, color: '#78c0f8', shadow: sh });
    if (m.gender === 'F') drawText(c, '♀', gx, ly, { font: FS, color: '#f89090', shadow: sh });
    drawHpBar(c, bx, by, curHp(m) / maxHp(m), null);
    const hp = `${curHp(m)}/${maxHp(m)}`;
    drawText(c, hp, rx - measureText(hp, FS), ry, { font: FS, color: col.text, shadow: sh });
  }

  // ---------- bolsa (estilo FRLG) ----------
  bagMenu(b) {
    return new Promise((resolve) => {
      const bag = this.getBag();
      const pockets = [{ name: 'ITENS', list: [] }, { name: 'POKé BOLAS', list: [] }];
      if (b.wild && b.o.canCatch) pockets[1].list.push({ key: 'pokeball', name: 'POKé BOLA', n: '∞', desc: 'Captura Pokémon selvagens. Nunca acaba.' });
      for (const [key, n] of Object.entries(bag)) {
        const it = ITEMS[key];
        if (!n || !it) continue;
        if (it.kind === 'heal' || it.kind === 'boost') pockets[0].list.push({ key, name: it.name.toUpperCase(), n: `×${n}`, desc: it.desc });
        if (it.kind === 'ball') pockets[1].list.push({ key, name: it.name.toUpperCase(), n: `×${n}`, desc: it.desc + (b.wild && b.o.canCatch ? '' : ' (Só contra Pokémon selvagens.)'), off: !(b.wild && b.o.canCatch) });
      }
      const scr = { kind: 'bag', pocket: this.lastPocket ?? (b.wild && b.o.canCatch ? 1 : 0), cur: 0, top: 0, pockets };
      const prevScreen = this.s.screen;
      const finish = (v) => { this.s.screen = prevScreen; this.keyHandler = null; this.tapHandler = null; this.lastPocket = scr.pocket; resolve(v); };
      const rows = () => pockets[scr.pocket].list.concat([{ key: null, name: 'FECHAR', n: '', desc: 'Fecha a bolsa e volta para a batalha.' }]);
      const choose = async (i) => {
        const r = rows();
        const it = r[i];
        if (!it.key) { finish(null); return; }
        if (it.off) { Sound.bad(); return; }
        if (it.key === 'pokeball' || ITEMS[it.key].kind === 'ball') { finish({ type: 'ball', key: it.key }); return; }
        if (it.key === 'xattack') { finish({ type: 'item', key: it.key }); return; }
        this.keyHandler = null; this.tapHandler = null;
        const tIdx = await this.partyMenu(b, false, 'item');
        this.s.screen = scr;
        if (tIdx == null) { bind(); return; }
        const target = b.party[tIdx];
        if (curHp(target) <= 0 || curHp(target) >= maxHp(target)) { Sound.bad(); scr.note = curHp(target) <= 0 ? 'Não funciona em quem desmaiou.' : 'O HP já está cheio!'; setTimeout(() => (scr.note = null), 1400); bind(); return; }
        finish({ type: 'item', key: it.key, target: tIdx });
      };
      const bind = () => {
        this.keyHandler = (k) => {
          const r = rows();
          if (k === 'A') { Sound.blip(); choose(scr.cur); return; }
          if (k === 'B') { Sound.blip(); finish(null); return; }
          if (k === 'U' && scr.cur > 0) { scr.cur--; Sound.cursor(); }
          if (k === 'D' && scr.cur < r.length - 1) { scr.cur++; Sound.cursor(); }
          if (k === 'L' || k === 'R') { scr.pocket = 1 - scr.pocket; scr.cur = 0; scr.top = 0; Sound.cursor(); }
          if (scr.cur < scr.top) scr.top = scr.cur;
          if (scr.cur > scr.top + 5) scr.top = scr.cur - 5;
        };
        this.tapHandler = (x, y) => {
          if (y < 24 && x < 88) { this.keyHandler(x < 44 ? 'L' : 'R'); return true; }
          if (x >= 88 && y < 104) {
            const i = scr.top + Math.floor((y - 6) / 16);
            if (i >= 0 && i < rows().length) { scr.cur = i; Sound.blip(); choose(i); return true; }
          }
          return false;
        };
      };
      scr.draw = (c) => this.drawBag(c, scr, rows());
      this.s.screen = scr;
      bind();
    });
  }
  drawBag(c, scr, rows) {
    rect(c, 0, 0, GW, GH, '#5070b0');
    for (let y = 0; y < 112; y += 4) rect(c, 0, y, 88, 1, '#5878b8');
    // aba do bolso
    drawWhiteBox(c, 4, 4, 80, 20, '#304880');
    const pn = scr.pockets[scr.pocket].name;
    drawText(c, pn, 44 - Math.floor(measureText(pn, FS) / 2), 6, { font: FS, color: GP.dark, shadow: GP.darkSh });
    pxArt(c, 8 + (Math.floor(this.s.tick / 20) % 2), 11, ART.arrowL, '#e04838');
    pxArt(c, 77 - (Math.floor(this.s.tick / 20) % 2), 11, ART.arrowR, '#e04838');
    this.drawBagSprite(c, 20, 34, scr.pocket);
    // lista
    rrect(c, 88, 0, 152, 112, '#283048', 2);
    rect(c, 90, 2, 148, 108, '#f8f8e8');
    rows.slice(scr.top, scr.top + 6).forEach((it, k) => {
      const i = scr.top + k, y = 4 + k * 16;
      const col = it.off ? '#a0a0a0' : GP.dark;
      const sp = measureText(it.name) > 100 ? 0 : null;
      drawText(c, it.name, 102, y, { color: col, shadow: GP.darkSh, spacing: sp, font: measureText(it.name, FN, sp) > 104 ? FS : FN });
      if (it.n) drawText(c, it.n, 232 - measureText(it.n), y, { color: col, shadow: GP.darkSh });
      if (i === scr.cur) drawCursor(c, 94, y);
    });
    if (scr.top > 0) pxArt(c, 162, 1, ['..#..', '.###.', '#####'], '#e04838');
    if (scr.top + 6 < rows.length) pxArt(c, 162, 107, ['#####', '.###.', '..#..'], '#e04838');
    // descrição
    drawBattleTextBox(c);
    const it = rows[scr.cur];
    rrect(c, 8, 120, 28, 28, '#283048', 2);
    rect(c, 9, 121, 26, 26, '#f8f8f8');
    if (it && it.key) {
      const ic = this.itemIcons && this.itemIcons[it.key];
      if (ic === undefined) { this.itemIcons = this.itemIcons || {}; this.itemIcons[it.key] = null; getItemIcon(it.key).then((cv) => { this.itemIcons[it.key] = cv; }); }
      else if (ic) c.drawImage(ic, 22 - Math.floor(ic.width / 2), 134 - Math.floor(ic.height / 2));
    } else pxArt(c, 18, 129, ['#...#', '.#.#.', '..#..', '.#.#.', '#...#'], '#c04040');
    const desc = scr.note || (it ? it.desc : '');
    wrapText(desc || '', 190).slice(0, 2).forEach((l, i) => drawText(c, l, 42, 116 + i * 16, { color: GP.light, shadow: GP.lightSh, spacing: measureText(l) > 190 ? 0 : null }));
  }
  drawBagSprite(c, x, y, pocket) {
    // Mochila desenhada em pixels (cor muda com o bolso).
    const body = pocket ? '#e05048' : '#e8a030', dark = pocket ? '#983028' : '#a86818', lite = pocket ? '#f89088' : '#f8d070';
    rrect(c, x + 6, y, 36, 8, dark, 2);
    rrect(c, x + 2, y + 6, 44, 40, '#303030', 3);
    rrect(c, x + 3, y + 7, 42, 38, body, 3);
    rect(c, x + 6, y + 9, 36, 3, lite);
    rrect(c, x + 8, y + 20, 32, 18, dark, 2);
    rect(c, x + 10, y + 22, 28, 14, body);
    rect(c, x + 20, y + 18, 8, 6, '#f8f8f8');
    rect(c, x + 22, y + 20, 4, 2, '#303030');
    const bob = Math.floor(this.s.tick / 30) % 2;
    if (bob) rect(c, x + 3, y + 44, 42, 1, '#283048');
  }

  // ---------- tela de golpes (aprender / esquecer) ----------
  moveListScreen(mon, mid) {
    return new Promise((resolve) => {
      const all = mon.moves.map((m) => ({ id: m.id, pp: m.pp, maxpp: m.maxpp })).concat([{ id: mid, pp: MOVES[mid].pp, maxpp: MOVES[mid].pp, isNew: true }]);
      const scr = { kind: 'moves', cur: 0, all, mon };
      getSprite(mon.id, { shiny: mon.shiny }).then((r) => (scr.spr = r));
      const prevScreen = this.s.screen;
      const finish = (v) => { this.s.screen = prevScreen; this.keyHandler = null; this.tapHandler = null; resolve(v); };
      scr.draw = (c) => this.drawMoveList(c, scr);
      this.s.screen = scr;
      this.select({ n: 5, state: scr, rects: all.map((_, i) => [80, 18 + i * 18, 160, 18]), onPick: (i) => finish(i === 4 ? -1 : i), onBack: () => finish(-1) });
    });
  }
  drawMoveList(c, scr) {
    rect(c, 0, 0, GW, GH, '#80a8d8');
    for (let y = 0; y < GH; y += 2) rect(c, 0, y, GW, 1, '#88b0e0');
    rect(c, 0, 0, GW, 16, '#304880');
    drawText(c, 'GOLPES', 6, 0, { color: GP.light, shadow: '#182848' });
    drawText(c, NAME(scr.mon), 234 - measureText(NAME(scr.mon), FS), 1, { font: FS, color: GP.light, shadow: '#182848' });
    drawWhiteBox(c, 4, 20, 72, 88, '#5070a0');
    if (scr.spr) { const fr = scr.spr.frames[0]; c.drawImage(fr, 40 - Math.floor(fr.width / 2), 92 - scr.spr.foot - 1); }
    drawText(c, `Nv${scr.mon.level}`, 10, 91, { font: FS, color: GP.dark, shadow: GP.darkSh });
    scr.all.forEach((m, i) => {
      const y = 18 + i * 18, mv = MOVES[m.id], sel = scr.cur === i;
      rrect(c, 80, y, 156, 17, sel ? '#f89048' : m.isNew ? '#405890' : '#506898', 2);
      rect(c, 82, y + 2, 152, 13, m.isNew ? '#f8f0c8' : '#f8f8f8');
      const T = TYPES[mv.type];
      rrect(c, 84, y + 4, 28, 9, T ? T.color : '#888', 1);
      const tag = T ? T.short : '?';
      drawText(c, tag, 98 - Math.floor(measureText(tag, FS) / 2), y - 1, { font: FS, color: '#f8f8f8' });
      const nm = mv.name.toUpperCase();
      drawText(c, nm, 115, y + 1, { font: FS, color: GP.dark, shadow: GP.darkSh, spacing: measureText(nm, FS) > 86 ? 0 : null });
      const pp = `${m.pp}/${m.maxpp}`;
      drawText(c, pp, 232 - measureText(pp, FS), y + 1, { font: FS, color: GP.dark, shadow: GP.darkSh });
    });
    drawBattleTextBox(c);
    const mv = MOVES[scr.all[scr.cur].id];
    drawText(c, scr.cur === 4 ? 'Não aprender este golpe.' : 'Qual golpe esquecer?', 11, 116, { color: GP.light, shadow: GP.lightSh });
    const info = `${mv.cat === 'phys' ? 'FÍSICO' : mv.cat === 'spec' ? 'ESPECIAL' : 'STATUS'}  PODER ${mv.bp || '-'}  PRECISÃO ${mv.acc === true ? '-' : mv.acc}`;
    drawText(c, info, 11, 132, { color: GP.light, shadow: GP.lightSh, spacing: measureText(info) > 216 ? 0 : null, font: measureText(info, FN, 0) > 216 ? FS : FN });
  }

  // ---------- caixas de HP ----------
  boxData(b, side, mon, hp = curHp(mon)) {
    const sd = b && b.sides[side];
    return { name: NAME(mon), gender: mon.gender, level: mon.level, hp, max: maxHp(mon), status: mon.status, shiny: mon.shiny, exp: this.expFrac(mon), tf: sd && sd.vol && sd.vol.transform };
  }
  expFrac(mon, exp = mon.exp) {
    if (mon.level >= 100) return 1;
    const a = expAt(mon.level), z = expAt(mon.level + 1);
    return Math.max(0, Math.min(1, (exp - a) / (z - a)));
  }
  setBox(side, d) {
    const box = side === 'e' ? this.s.boxE : this.s.boxP;
    box.d = d;
    box.cv = side === 'e' ? renderEnemyBox(d) : renderPlayerBox(d);
    if (side === 'p') Sound.lowHp(d.hp > 0 && d.hp / d.max <= 0.2 && !!this.battle && !this.battle.result);
  }
  refresh(b) {
    b = b || this.battle;
    if (!b) return;
    for (const side of ['p', 'e']) {
      const mon = b.sides[side].mon;
      if (!mon) continue;
      this.setBox(side, this.boxData(b, side, mon));
    }
  }
  async slideBox(side, on = true) {
    const box = side === 'e' ? this.s.boxE : this.s.boxP;
    const from = side === 'e' ? -130 : 140;
    box.visible = true;
    await tween(this.dur(260), (t) => { box.dx = Math.round(on ? from * (1 - t) : from * t); }, easeOut);
    if (!on) box.visible = false;
  }

  // Sprite com prazo: se a internet demorar, entra uma Poké Bola no lugar e o sprite troca sozinho quando chegar.
  async spriteFor(mon, back) {
    const p = getSprite(mon.id, { back, shiny: mon.shiny });
    const r = await Promise.race([p, sleep(4500).then(() => null)]);
    if (r) return r;
    p.then((late) => {
      if (!late || late.src === 'none') return;
      for (const side of ['e', 'p']) { const v = this.s[side]; if (v.mon === mon && v.spr && v.spr.src === 'none') v.spr = late; }
    });
    return placeholderInfo(back);
  }

  // ---------- abertura ----------
  async intro(b) {
    this.battle = b;
    b.o.auto = this.auto;
    const s = this.s;
    const first = b.enemy[0];
    const lim = (p) => Promise.race([p, sleep(4500).then(() => null)]);
    const [eSpr, trE, trP] = await Promise.all([
      b.wild ? this.spriteFor(first, false) : null,
      b.wild ? null : lim(getTrainerFront(b.o.trainer.sprite || b.o.trainer.name)),
      lim(getTrainerBack('red')),
    ]);
    if (b.wild) Object.assign(s.e, { mon: first, spr: eSpr, visible: !!eSpr, frame: 0 });
    else s.trE = { img: trE, visible: !!trE, dx: 0 };
    s.trP = { frames: trP ? trP.frames : null, frame: 0, visible: !!trP, dx: 0 };
    s.slideE = -GW; s.slideP = GW;
    s.showScene = true;
    if (b.wild) s.e.tint = '#000000';
    if (b.wild) s.e.tintA = 0.6;
    await tween(this.dur(1100), (t) => {
      s.wipe = Math.max(0, 1 - t * 2.2);
      s.slideE = Math.round(-GW * (1 - t)); s.slideP = Math.round(GW * (1 - t));
    }, easeOut);
    s.slideE = 0; s.slideP = 0;
    if (b.wild) {
      await tween(this.dur(220), (t) => (s.e.tintA = 0.6 * (1 - t)));
      s.e.tint = null;
      Sound.cry(first.id);
      this.animFrames('e');
      if (first.shiny) await this.sparkle('e');
      this.setBox('e', this.boxData(b, 'e', first));
      await this.slideBox('e');
      const leg = isSpecial(SPECIES[first.id]);
      await this.msg(leg ? `O ${NAME(first)} lendário apareceu!` : `Um ${NAME(first)} selvagem apareceu!`);
    } else {
      s.balls = { e: b.enemy, p: b.party, dx: 120 };
      await tween(this.dur(300), (t) => (s.balls.dx = Math.round(120 * (1 - t))), easeOut);
      const tr = b.o.trainer;
      await this.msg(`${tr.title ? tr.title.toUpperCase() + ' ' : ''}${tr.name.toUpperCase()} quer batalhar!`);
      if (tr.quote) await this.msg(`"${tr.quote}"`);
    }
  }
  // Animação de 2 quadros (sprites estilo Emerald) quando o Pokémon aparece.
  async animFrames(side) {
    const v = this.s[side];
    if (!v.spr || v.spr.frames.length < 2) return;
    for (let i = 0; i < 4; i++) { v.frame = i % 2 ? 0 : 1; await sleep(this.dur(140)); }
    v.frame = 0;
  }
  async sendOut(b, side, mon, prev, first) {
    this.battle = b;
    const s = this.s;
    if (side === 'e') {
      if (b.wild && first) { this.setBox('e', this.boxData(b, 'e', mon)); s.boxE.visible = true; return; }
      if (first) {
        s.balls && tween(this.dur(250), (t) => (s.balls.dx = Math.round(-120 * t)));
        await tween(this.dur(380), (t) => (s.trE.dx = Math.round(90 * t)), easeIn);
        s.trE.visible = false; s.balls = null;
      } else if (s.boxE.visible) await this.slideBox('e', false);
      await this.msg(`${b.o.trainer.name.toUpperCase()} enviou ${NAME(mon)}!`, { noWait: true });
      await this.popOut(b, 'e', mon, { x: EN.x, y: EN.y - 20 });
    } else {
      if (prev && curHp(prev) > 0) {
        await this.msg(`${NAME(prev)}, volte!`, { noWait: true });
        await this.recall('p');
      }
      if (s.boxP.visible) await this.slideBox('p', false);
      await this.msg(first ? `Vai! ${NAME(mon)}!` : `Sua vez, ${NAME(mon)}!`, { noWait: true });
      if (first && s.trP.visible) {
        // O treinador arremessa e sai pela esquerda.
        const anim = (async () => { for (let f = 1; f < (s.trP.frames ? s.trP.frames.length : 1); f++) { s.trP.frame = f; await sleep(this.dur(70)); } })();
        await tween(this.dur(420), (t) => (s.trP.dx = Math.round(-110 * t)), easeIn);
        await anim;
        s.trP.visible = false;
      }
      await this.throwBall({ x: 20, y: 80 }, { x: PL.x, y: PL.y - 32 }, 'pokeball', 22);
      await this.popOut(b, 'p', mon, { x: PL.x, y: PL.y - 32 });
    }
  }
  async throwBall(from, to, kind, arc = 28, dur = 380) {
    const s = this.s;
    s.ball = { kind, x: from.x, y: from.y, rot: 0 };
    Sound.throwBall();
    await tween(this.dur(dur), (t) => {
      s.ball.x = from.x + (to.x - from.x) * t;
      s.ball.y = from.y + (to.y - from.y) * t - Math.sin(t * Math.PI) * arc;
      s.ball.rot = t * Math.PI * 4;
    });
    s.ball.rot = 0;
  }
  async popOut(b, side, mon, at) {
    const s = this.s, v = s[side];
    const spr = await this.spriteFor(mon, side === 'p');
    s.ball = s.ball || { kind: 'pokeball', x: at.x, y: at.y };
    Object.assign(v, { mon, spr, visible: !!spr, frame: 0, white: 1, scale: 0.1, sink: 0, alpha: 1, dx: 0, dy: 0, tint: null, tintA: 0, blink: false });
    Sound.pop();
    this.burst(side, '#f8f8f8', 10, 'star');
    s.ball = null;
    await tween(this.dur(320), (t) => { v.scale = 0.1 + 0.9 * t; }, easeOut);
    v.scale = 1;
    await tween(this.dur(220), (t) => { v.white = 1 - t; });
    v.white = 0;
    Sound.cry(mon.id);
    this.animFrames(side);
    if (mon.shiny) await this.sparkle(side);
    this.setBox(side, this.boxData(b, side, mon));
    await this.slideBox(side);
  }
  async recall(side) {
    const v = this.s[side];
    v.tint = '#f84040';
    await tween(this.dur(160), (t) => (v.tintA = t * 0.7));
    await tween(this.dur(260), (t) => { v.scale = 1 - 0.9 * t; v.white = t; });
    v.visible = false; v.scale = 1; v.white = 0; v.tint = null; v.tintA = 0;
    Sound.pop();
  }
  async sparkle(side) {
    Sound.tone(1568, 0.08, { vol: 0.04 }); Sound.tone(2093, 0.08, { vol: 0.04, at: 0.1 });
    this.burst(side, '#f8f080', 12, 'star');
    await sleep(this.dur(600));
  }

  // ---------- efeitos ----------
  center(side) { return side === 'e' ? { x: EN.x, y: EN.y - 24 } : { x: PL.x, y: PL.y - 34 }; }
  burst(side, color, n = 8, kind = 'dot') {
    const C = this.center(side);
    for (let i = 0; i < n; i++) {
      const a = (i / n) * Math.PI * 2 + Math.random() * 0.4;
      const sp = 40 + Math.random() * 50;
      this.s.fx.push({ x: C.x, y: C.y, vx: Math.cos(a) * sp, vy: Math.sin(a) * sp, life: 520, max: 520, color, kind, size: 2 + (i % 2) });
    }
  }
  beam(fromSide, color, n = 14) {
    const A = this.center(fromSide), B = this.center(fromSide === 'e' ? 'p' : 'e');
    for (let i = 0; i < n; i++) {
      const t0 = i * 30;
      setTimeout(() => {
        const life = this.dur(420);
        this.s.fx.push({ x: A.x, y: A.y, vx: ((B.x - A.x) / life) * 1000, vy: ((B.y - A.y) / life) * 1000, life, max: life, color, size: 3 });
      }, this.dur(t0));
    }
  }
  async hp(b, side, from, to) {
    const mon = b.sides[side].mon;
    const max = maxHp(mon);
    const total = this.dur(Math.min(1000, 250 + (Math.abs(from - to) / max) * 1000));
    let lastV = null;
    await tween(total, (t) => {
      const v = Math.round(from + (to - from) * t);
      if (v === lastV) return;
      lastV = v;
      this.setBox(side, this.boxData(b, side, mon, v));
    });
    this.setBox(side, this.boxData(b, side, mon, to));
  }
  async hit(b, side, eff, crit) {
    const v = this.s[side];
    Sound.hit(eff);
    if (eff > 1 || crit) this.s.shake = this.dur(300);
    for (let i = 0; i < 4; i++) { v.blink = true; await sleep(this.dur(60)); v.blink = false; await sleep(this.dur(60)); }
  }
  async attackAnim(b, side, mv) {
    const v = this.s[side];
    v.alpha = 1;
    const color = TYPES[mv.type] ? TYPES[mv.type].color : '#f8f8f8';
    const dir = side === 'e' ? -1 : 1;
    if (mv.cat === 'phys') {
      await tween(this.dur(120), (t) => { v.dx = Math.round(dir * 10 * t); v.dy = Math.round(-dir * 4 * t); });
      this.burst(side === 'e' ? 'p' : 'e', color, 9);
      await tween(this.dur(140), (t) => { v.dx = Math.round(dir * 10 * (1 - t)); v.dy = Math.round(-dir * 4 * (1 - t)); });
      v.dx = 0; v.dy = 0;
    } else {
      this.beam(side, color);
      await sleep(this.dur(460));
      this.burst(side === 'e' ? 'p' : 'e', color, 10);
    }
  }
  async chargeAnim(b, side, mv) {
    const v = this.s[side];
    this.burst(side, TYPES[mv.type].color, 8, 'ring');
    await tween(this.dur(420), (t) => (v.white = Math.sin(t * Math.PI) * 0.8));
    v.white = 0;
    v.alpha = SEMI_INV.has(mv.id) ? 0 : 1;
  }
  async statusMoveAnim(b, side, mv, self) {
    const target = self ? side : b.other(side);
    this.burst(target, TYPES[mv.type].color, 9, 'ring');
    await sleep(this.dur(360));
    this.s[side].alpha = 1;
  }
  async statusAnim(b, side, code) {
    const color = { brn: '#f87830', par: '#f8d030', psn: '#b058d8', tox: '#9038c0', slp: '#a8b8f8', frz: '#88e0f8', confusion: '#f8b0e8' }[code] || '#f8f8f8';
    const v = this.s[side];
    v.tint = color;
    Sound.status();
    this.burst(side, color, 6, code === 'slp' ? 'z' : 'dot');
    await tween(this.dur(480), (t) => (v.tintA = Math.sin(t * Math.PI * 2) ** 2 * 0.7));
    v.tint = null; v.tintA = 0;
    this.refresh(b);
  }
  async statAnim(b, side, up) {
    up ? Sound.statUp() : Sound.statDown();
    const v = this.s[side];
    v.tint = up ? '#f86040' : '#4878f8';
    const C = this.center(side);
    for (let i = 0; i < 6; i++) this.s.fx.push({ x: C.x - 20 + i * 8, y: C.y + (up ? 16 : -16), vx: 0, vy: up ? -50 : 50, life: 500, max: 500, color: up ? '#f86040' : '#4878f8', kind: up ? 'arrowU' : 'arrowD' });
    await tween(this.dur(520), (t) => (v.tintA = Math.abs(Math.sin(t * Math.PI * 3)) * 0.55));
    v.tint = null; v.tintA = 0;
  }
  async transformAnim(b, side) {
    const sd = b.sides[side], v = this.s[side];
    await tween(this.dur(260), (t) => (v.white = t));
    const spr = await getSprite(sd.vol.transform.id, { back: side === 'p', shiny: sd.mon.shiny });
    if (spr) v.spr = spr;
    await tween(this.dur(260), (t) => (v.white = 1 - t));
    v.white = 0;
  }
  async faint(b, side) {
    const v = this.s[side];
    Sound.cry(b.sides[side].mon.id, 0.75);
    await sleep(this.dur(300));
    Sound.faint();
    const h = v.spr ? v.spr.h : 64;
    await tween(this.dur(420), (t) => (v.sink = h * t), easeIn);
    v.visible = false; v.sink = 0;
    await this.slideBox(side, false);
    if (side === 'p') Sound.lowHp(false);
  }
  async catchAnim(b, key, shakes, caught) {
    const s = this.s, v = s.e;
    const target = { x: EN.x, y: EN.y - 26 };
    await this.throwBall({ x: 30, y: 96 }, target, key, 34, 520);
    // O Pokémon vira luz e entra na bola.
    s.flash = 0.6;
    Sound.pop();
    await tween(this.dur(160), (t) => (v.white = t));
    await tween(this.dur(300), (t) => { v.scale = 1 - 0.95 * t; });
    v.visible = false; v.scale = 1; v.white = 0;
    // A bola cai na plataforma e quica.
    const ground = EN.y - 5;
    await tween(this.dur(280), (t) => (s.ball.y = target.y + (ground - target.y) * t), easeIn);
    Sound.shake();
    await tween(this.dur(160), (t) => (s.ball.y = ground - Math.sin(t * Math.PI) * 6));
    s.ball.y = ground;
    for (let i = 0; i < shakes; i++) {
      await sleep(this.dur(420));
      Sound.shake();
      await tween(this.dur(360), (t) => (s.ball.rot = Math.sin(t * Math.PI * 2) * 0.45));
      s.ball.rot = 0;
    }
    await sleep(this.dur(380));
    if (caught) {
      Sound.shake();
      for (let i = 0; i < 6; i++) s.fx.push({ x: s.ball.x, y: s.ball.y - 4, vx: (i - 2.5) * 22, vy: -50 - (i % 2) * 20, g: 140, life: 600, max: 600, color: '#f8e050', kind: 'star' });
      s.ball.dark = true;
      await sleep(this.dur(500));
      await this.slideBox('e', false);
    } else {
      s.flash = 0.8;
      Sound.pop();
      s.ball = null;
      Object.assign(v, { visible: true, scale: 0.1, white: 1 });
      await tween(this.dur(260), (t) => (v.scale = 0.1 + 0.9 * t), easeOut);
      v.scale = 1;
      await tween(this.dur(200), (t) => (v.white = 1 - t));
      v.white = 0;
    }
  }
  async exp(b, mon, from, to) {
    if (b.sides.p.mon !== mon) return;
    const base = this.boxData(b, 'p', mon);
    await tween(this.dur(600), (t) => { this.s.boxP.cv = renderPlayerBox({ ...base, exp: this.expFrac(mon, from + (to - from) * t) }); });
    Sound.tone(1200, 0.05, { vol: 0.02 });
  }
  async levelUp(b, mon, isActive) {
    if (!isActive) return;
    this.refresh(b);
    await tween(this.dur(360), (t) => (this.s.boxP.flash = Math.sin(t * Math.PI)));
    this.s.boxP.flash = 0;
  }
  async outro(b) {
    const s = this.s;
    Sound.lowHp(false);
    if (b.result === 'win' && !b.wild) {
      const tr = b.o.trainer;
      if (!s.trE.img) s.trE.img = await getTrainerFront(tr.sprite || tr.name);
      s.trE.visible = !!s.trE.img; s.trE.dx = 90;
      await tween(this.dur(420), (t) => (s.trE.dx = Math.round(90 * (1 - t))), easeOut);
      await this.msg(`Você derrotou ${tr.title ? tr.title.toUpperCase() + ' ' : ''}${tr.name.toUpperCase()}!`, { sound: 'win' });
      if (tr.winQuote) await this.msg(`"${tr.winQuote}"`);
    }
    if (b.result === 'lose' && b.o.trainer && b.o.trainer.loseQuote) await this.msg(`"${b.o.trainer.loseQuote}"`);
    await tween(this.dur(420), (t) => (s.fade = t));
  }

  // ---------- cena de evolução ----------
  drawEvolution(c) {
    const e = this.s.evo;
    if (!this.evoBg) {
      const bg = mkCanvas(GW, 112), g = bg.getContext('2d');
      for (let y = 0; y < 112; y++) rect(g, 0, y, GW, 1, y % 4 < 2 ? '#183050' : '#142848');
      for (let i = 0; i < 9; i++) pxEllipse(g, 120, 104, 110 - i * 12, 30 - i * 3, i % 2 ? '#20406a' : '#1a3860');
      this.evoBg = bg;
    }
    c.drawImage(this.evoBg, 0, 0);
    const t = this.s.tick;
    for (let i = 0; i < 14; i++) {
      const a = (i / 14) * Math.PI * 2 + t / 40;
      const r = 40 + ((t * 2 + i * 23) % 50);
      if (e.sparks) { c.fillStyle = i % 2 ? '#f8f8f8' : '#a8d8f8'; c.fillRect(Math.round(120 + Math.cos(a) * r), Math.round(60 + Math.sin(a) * r * 0.6), 1, 1); }
    }
    const spr = e.show === 'new' ? e.newSpr : e.oldSpr;
    if (spr) {
      const fr = spr.frames[0];
      const x = 120 - Math.floor(fr.width / 2), y = 100 - spr.foot - 1;
      c.drawImage(e.white ? silhouette(fr, '#f8f8f8') : fr, x, y);
    }
  }
}

// Evolução na tela do GBA. Como nos jogos, apertar B durante a animação cancela.
async function evolutionScene(ui, mon, toId, canCancel = true) {
  ui.reset();
  ui.root.hidden = false;
  document.body.classList.add('in-battle');
  ui.fit();
  ui.startLoop();
  const [oldSpr, newSpr] = await Promise.all([ui.spriteFor(mon, false), ui.spriteFor({ ...mon, id: toId }, false)]);
  ui.s.evo = { oldSpr, newSpr, show: 'old', white: false, sparks: false };
  ui.s.fade = 1;
  await tween(ui.dur(300), (t) => (ui.s.fade = 1 - t));
  const oldName = NAME(mon);
  await ui.msg(`O quê? ${oldName} está evoluindo!`);
  Sound.cry(mon.id);
  Sound.evolve();
  let cancelled = false;
  if (!ui.auto && canCancel) ui.keyHandler = (b) => { if (b === 'B') cancelled = true; };
  ui.s.evo.sparks = true;
  ui.s.evo.white = true;
  let delay = 420;
  for (let i = 0; i < 14 && !cancelled; i++) {
    ui.s.evo.show = i % 2 ? 'new' : 'old';
    await sleep(ui.dur(delay));
    delay = Math.max(60, delay * 0.8);
  }
  ui.keyHandler = null;
  ui.s.evo.show = 'old';
  if (cancelled) {
    ui.s.evo.white = false; ui.s.evo.sparks = false;
    await ui.msg(`Hã? ${oldName} parou de evoluir!`);
    await tween(ui.dur(300), (t) => (ui.s.fade = t));
    ui.close();
    return false;
  }
  ui.s.flash = 1;
  ui.s.evo.show = 'new';
  ui.s.evo.white = false;
  evolveTo(mon, toId);
  Sound.cry(toId);
  await ui.msg(`Parabéns! Seu ${oldName} evoluiu para ${NAME(mon)}!`, { sound: 'good' });
  ui.s.evo.sparks = false;
  for (const mid of movesLearnedAt(toId, mon.level, true)) {
    const fake = { party: [mon], sides: { p: { mon }, e: { mon } }, o: { auto: ui.auto }, ui };
    await Battle.prototype.learnMove.call(Object.assign(Object.create(Battle.prototype), fake), mon, mid, true);
  }
  await tween(ui.dur(300), (t) => (ui.s.fade = t));

// ======================================================================
// Fluxo da aventura: roletas, eventos, painéis, PC, conquistas e configurações.
// ======================================================================
const SAVE_KEY = 'roleta-gba-save-v1';
const META_KEY = 'roleta-gba-meta-v1';
const $ = (s) => document.querySelector(s);

function loadJSON(k) { try { return JSON.parse(localStorage.getItem(k)); } catch (e) { return null; } }
function storeJSON(k, v) { try { localStorage.setItem(k, JSON.stringify(v)); } catch (e) { /* sem armazenamento: o jogo segue sem salvar */ } }

const DEFAULT_SETTINGS = { sound: true, textSpeed: 'normal', wheelSpeed: 'normal', catchMode: 'battle', autoBattle: false, autoPlay: false, difficulty: 'normal', unlockAll: false };
let M = loadJSON(META_KEY) || {};
M = { attempt: 1, wins: 0, best: 0, bestBadges: 0, unlockedGens: [1], achievements: {}, skin: 'poke', ...M };
M.settings = { ...DEFAULT_SETTINGS, ...(M.settings || {}) };
let S = loadJSON(SAVE_KEY) || newState();

function newState() {
  return { gen: null, stage: 0, eventsDone: 0, pendingEvents: 0, villainBeaten: -1, team: [], pc: [], items: {}, over: false, won: false,
    evoChance: 0.25, caught: 0, revivesUsed: 0, skipEvent: false, starterRoot: null, lostTo: '' };
}
function save() { storeJSON(SAVE_KEY, S); }
function saveMeta() { storeJSON(META_KEY, M); }

const gen = () => genById(S.gen);
const maxId = () => gen().dex[1];
const diff = () => DIFF[M.settings.difficulty] || 0;
const badges = () => Math.min(8, S.stage);

let wheel, BUI;

// ---------------------- interface geral ----------------------
function applyTheme() {
  const g = S.gen ? gen() : GENERATIONS[0];

  r.setProperty('--accent', g.accent);
  r.setProperty('--bg1', g.bg[0]);

function setScene(title, subtitle = '') {
  $('#title').textContent = title;
  $('#subtitle').innerHTML = subtitle;
  $('#stageline').textContent = stageLine();
}
function stageLine() {
  if (!S.gen) return 'ESCOLHA SUA AVENTURA';
  const g = gen();
  const where = S.stage < 8 ? `RUMO AO GINÁSIO ${S.stage + 1}/8` : S.stage < 12 ? `ELITE DOS 4 · ${S.stage - 7}/4` : S.stage === 12 ? 'CAMPEÃO DA LIGA' : 'HALL DA FAMA';

function showWheel(segments) {
  $('#card').hidden = true;
  $('#wheel-box').hidden = false;
  $('#result').classList.remove('show');
  wheel.resize();
  wheel.setSegments(segments);
}
function showCard(html) {
  $('#wheel-box').hidden = true;
  $('#result').classList.remove('show');
  const c = $('#card');
  c.innerHTML = html;
  c.hidden = false;
}

// Botões na barra de ações. Retorna o value do botão clicado.
function choose(buttons, { autoValue } = {}) {
  const bar = $('#actions');
  bar.innerHTML = '';
  return new Promise((resolve) => {
    const done = (v) => { clearTimeout(t); bar.innerHTML = ''; resolve(v); };
    buttons.forEach((b) => {
      const el = document.createElement('button');
      el.type = 'button';
      el.className = `btn ${b.cls || 'yellow big'}`;
      el.innerHTML = b.label;
      el.onclick = () => { Sound.ensure(); Sound.blip(); done(b.value); };
      bar.appendChild(el);
    });
    let t = null;
    if (M.settings.autoPlay) {
      const def = autoValue !== undefined ? autoValue : buttons[0].value;
      t = setTimeout(() => done(def), 1500);
    }
  });
}

async function message(title, html, { image, button = 'Continuar', sound, cry } = {}) {
  setScene(title);
  showCard(`<div class="msg">${image ? `<div class="msg-img">${image}</div>` : ''}<div class="msg-text">${html}</div></div>`);
  if (sound && Sound[sound]) Sound[sound]();
  if (cry) Sound.cry(cry);
  renderAll();
  await choose([{ label: button, value: true }]);
}

function toast(text, icon = '') {
  const t = document.createElement('div');
  t.className = 'toast';
  t.innerHTML = `${icon ? `<span class="ti">${icon}</span>` : ''}<span>${text}</span>`;
  $('#toasts').appendChild(t);
  setTimeout(() => t.classList.add('out'), 3200);
  setTimeout(() => t.remove(), 3800);
}

// Gira uma roleta. segments: [{label, weight, color, img, value}]
async function spinScene({ title, subtitle = '', segments, button = 'GIRAR!' }) {
  setScene(title, subtitle);
  showWheel(segments);
  renderAll();
  await choose([{ label: button, value: true }]);
  $('#actions').innerHTML = '<button class="btn yellow big" disabled>Girando…</button>';
  const dur = M.settings.wheelSpeed === 'rápida' ? 2200 : 4600;
  const seg = await wheel.spin(dur);
  $('#actions').innerHTML = '';
  const r = $('#result');
  r.innerHTML = `${seg.img ? imgHTML(seg.img, 'ri') : ''}<span>${seg.bonus ? '??? Bônus misterioso!' : seg.label}</span>`;
  r.classList.add('show');
  Sound.good();
  await sleep(M.settings.wheelSpeed === 'rápida' ? 600 : 1000);
  return seg;
}

function pokeSegments(ids, { cap = 150, bonus = false } = {}) {

  const segs = list.map((id, i) => {
    const s = SPECIES[id];
    return { label: s.name, weight: 1, color: mix(TYPES[s.types[0]].color, i % 2 ? '#000000' : '#ffffff', 0.12), img: iconSprite(id), value: id };
  });
  if (bonus && chance(0.5)) segs.splice(rnd(segs.length), 0, { label: '???', weight: Math.max(1, segs.length * 0.045), bonus: true, value: 'bonus', color: '#f5c518' });
  return segs;
}
function teamSegments(list) {
  return list.map((p, i) => ({ label: nameOf(p), weight: 1, color: mix(TYPES[SPECIES[p.id].types[0]].color, i % 2 ? '#000000' : '#ffffff', 0.1), img: iconSprite(p.id, p.shiny), value: p }));
}
function yesNo(yes, no, p) {
  return [
    { label: `${yes} ${Math.round(p * 100)}%`, weight: p, color: '#1e8c4e', value: true },
    { label: `${no} ${Math.round((1 - p) * 100)}%`, weight: 1 - p, color: '#c0392b', value: false },
  ];
}
const typeTag = (t) => (t ? `<span class="type" style="background:${TYPES[t].color}">${TYPES[t].name}</span>` : '');

// ---------------------- painéis ----------------------
function renderAll() {

function renderTeam() {

function bagCount() { return Object.values(S.items).reduce((a, b) => a + b, 0); }
function renderBag() {
  const el = $('#bag');
  const keys = Object.keys(S.items).filter((k) => S.items[k] > 0);
  $('#bag-count').textContent = `${bagCount()}/${BAG_LIMIT}`;
  el.innerHTML = keys.length ? keys.map((k) => `<button type="button" class="item${ITEMS[k].kind === 'evo' && S.team.length && evoItemUsers(k).length ? ' usable' : ''}" title="${itemDesc(k)}" data-k="${k}">${itemImg(k)}<span>${ITEMS[k].name.toUpperCase()}</span><b>×${S.items[k]}</b></button>`).join('')
    : '<p class="hint">Vazia. Itens aparecem nos eventos da roleta.</p>';
  el.querySelectorAll('.item').forEach((b) => (b.onclick = () => itemClick(b.dataset.k)));
}
// Clique num item da mochila: os de evolução podem ser usados a qualquer hora (fora da batalha).
let busyItem = false;
function itemClick(k) {
  if (ITEMS[k].kind !== 'evo') { toast(itemDesc(k)); return; }
  const users = evoItemUsers(k);
  if (!users.length) { toast(`${ITEMS[k].name}: ninguém da equipe evolui com este item agora. ${itemDesc(k)}`); return; }
  if (busyItem || !BUI.root.hidden) return;
  const { el, close } = openModal(`Usar ${ITEMS[k].name}`, `<p class="hint">${itemDesc(k)}</p><div class="row-btns">${users.map((p, i) => `<button type="button" class="btn green" data-i="${i}">${nameOf(p)}</button>`).join('')}</div>`);
  el.querySelectorAll('[data-i]').forEach((b) => (b.onclick = async () => {
    close();
    busyItem = true;
    try { await useEvoItem(k, users[+b.dataset.i]); } finally { busyItem = false; renderAll(); }
  }));
}

// ---------------------- itens ----------------------
function addItem(key, n = 1) { S.items[key] = (S.items[key] || 0) + n; }
function useItem(key) { if (S.items[key]) { S.items[key]--; if (!S.items[key]) delete S.items[key]; save(); renderBag(); } }
function rollItem() {
  const total = ITEM_WHEEL.reduce((s, [, w]) => s + w, 0);
  let r = Math.random() * total;
  for (const [k, w] of ITEM_WHEEL) { r -= w; if (r <= 0) return k; }
  return 'potion';
}
// Descrição do item (os de evolução listam quem evolui com ele nesta região).
function itemDesc(key) {
  const it = ITEMS[key];
  if (it.kind !== 'evo' || it.desc) return it.desc || '';
  const ids = (EVO_ITEMS[key] || []).filter((id) => id <= (S.gen ? maxId() : 1025));
  const pre = [...new Set(ids.map((id) => SPECIES[SPECIES[id].prevo].name))];
  return pre.length ? `Faz evoluir: ${pre.join(', ')}.` : 'Nenhum Pokémon desta região evolui com ela.';
}
async function giveItem(key, title, text) {
  if (key === 'stone') key = await stoneWheel();
  if (key === 'rarecandy') {
    await message(title, `${text} <b>${ITEMS[key].name}</b>! Alguém da equipe vai comer agora mesmo.`, { image: itemImg(key), sound: 'good' });
    return rareCandy();
  }
  addItem(key);
  save();
  await message(title, `${text} <b>${ITEMS[key].name}</b>!<br><small>${itemDesc(key)}</small>`, { image: itemImg(key), sound: 'good' });
  if (ITEMS[key].kind === 'evo') await offerEvoItem(key);
  await enforceBagLimit();
}
async function enforceBagLimit() {
  while (bagCount() > BAG_LIMIT) {
    const segs = Object.keys(S.items).filter((k) => S.items[k] > 0).map((k) => ({ label: ITEMS[k].name, weight: S.items[k], color: ITEM_COLORS[k] || '#555', img: itemSprite(k), value: k }));
    const seg = await spinScene({ title: 'Mochila cheia!', subtitle: `Só cabem ${BAG_LIMIT} itens. A roleta escolhe qual fica para trás…`, segments: segs });
    useItem(seg.value);
    unlock('fullbag');
    await message('Item descartado', `Você deixou <b>${ITEMS[seg.value].name}</b> para trás.`, { image: itemImg(seg.value) });
  }
}

// ---------------------- Pokémon da equipe ----------------------
function canEvolveList(list = S.team) { return list.filter((p) => evosOf(p.id, maxId()).length); }

async function addPokemon(mon, verb = 'capturou') {
  healFull(mon);
  mon.caughtAt = S.stage;
  S.caught++;
  if (S.team.length < 6) {
    S.team.push(mon);
    save();
    if (S.team.length === 6) unlock('fullteam');
  } else {
    S.pc.push(mon);
    save();
    toast(`${nameOf(mon)} foi para o PC (equipe cheia).`, '💻');
  }
  if (mon.shiny) { unlock('shiny'); Effects.confetti(); }
  if (isSpecial(SPECIES[mon.id])) unlock('legend');
  if (S.caught >= 10) unlock('catch10');
  renderAll();
  void verb;
}

// Evoluções que acontecem só subindo de nível (as de pedra, troca e amizade ficam de fora).
function levelEvoTargets(p) {
  return evosOf(p.id, maxId()).filter((e) => { const m = evoMethod(e); return (m.kind === 'level' || m.kind === 'special') && genderOk(p, m); });
}
// Doce Raro: a roleta escolhe quem come; se ele evolui por nível, cresce até evoluir.
async function rareCandy() {
  if (!S.team.length) return;
  const evo = S.team.filter((p) => levelEvoTargets(p).length);
  const list = evo.length ? evo : S.team;
  let target = list[0];
  if (list.length > 1) target = (await spinScene({ title: 'Quem come o Doce Raro?', subtitle: evo.length ? 'Ele vai crescer até evoluir!' : 'Ninguém evolui por nível agora: quem comer sobe 3 níveis.', segments: teamSegments(list) })).value;
  if (evo.length) {
    const to = pick(levelEvoTargets(target));
    const need = Math.max(target.level + 1, evoMethod(to).level);
    setLevel(target, Math.min(100, need));
    await evolveScene(target, to);
  } else {
    setLevel(target, Math.min(100, target.level + 3));
    await message('Doce Raro!', `<b>${nameOf(target)}</b> subiu para o Nv. ${target.level}!`, { image: imgHTML(showSprite(target.id, target.shiny)), sound: 'good' });
    await levelEvolutions();
  }
  save(); renderAll();
}
function setLevel(p, lvl) {
  const old = p.level;
  p.level = lvl;
  p.exp = Math.max(p.exp, expAt(lvl));
  if (lvl > old) { p.pendingEvo = true; for (let L = old; L < lvl; L++) levelFriendship(p); }
  // Aprende os golpes dos níveis pulados (sem perguntar).
  for (let L = old + 1; L <= lvl; L++) {
    for (const mid of movesLearnedAt(p.id, L)) {
      if (p.moves.some((m) => m.id === mid)) continue;
      if (p.moves.length < 4) p.moves.push({ id: mid, pp: MOVES[mid].pp, maxpp: MOVES[mid].pp });
      else { const i = autoForget(p, mid); if (i >= 0) p.moves[i] = { id: mid, pp: MOVES[mid].pp, maxpp: MOVES[mid].pp }; }
    }
  }
  if (lvl >= 50) unlock('level50');
}
// Cena de evolução. Evolução por nível pode ser cancelada com B (como nos jogos); por item ou troca, não.
async function evolveScene(p, to, canCancel = true) {
  BUI.auto = M.settings.autoBattle || M.settings.autoPlay;
  const ok = await evolutionScene(BUI, p, to, canCancel);
  if (ok) unlock('evolve');
  save(); renderAll();
  return ok;
}
// Evoluções por nível (e por amizade, quando ele acabou de subir de nível) depois das batalhas.
async function levelEvolutions() {
  for (const p of S.team.slice()) {
    const to = levelEvoOf(p, maxId(), !!p.pendingEvo);
    p.pendingEvo = false;
    if (to) await evolveScene(p, to);
  }
  save();
}
// Itens de evolução: quem da equipe pode usar.
function evoItemUsers(item, list = S.team) { return list.filter((p) => itemEvoTargets(p, item, maxId()).length); }
async function useEvoItem(item, p) {
  const opts = itemEvoTargets(p, item, maxId());
  if (!opts.length) return false;
  let to = opts[0];
  if (opts.length > 1) to = (await spinScene({ title: `${nameOf(p)} vai evoluir para…`, segments: pokeSegments(opts) })).value;
  useItem(item);
  await evolveScene(p, to, false);
  return true;
}
// Pergunta se quer usar o item de evolução agora.
async function offerEvoItem(item) {
  const users = evoItemUsers(item);
  if (!users.length || !S.items[item]) return;
  const it = ITEMS[item];
  setScene(`Usar ${it.name}?`, 'Itens de evolução ficam na mochila até você usar.');
  showCard(`<div class="msg"><div class="msg-img">${itemImg(item)}</div><div class="msg-text">${users.map((p) => `<b>${nameOf(p)}</b>`).join(', ')} ${users.length > 1 ? 'podem' : 'pode'} evoluir com <b>${it.name}</b>.</div></div>`);
  renderAll();
  const buttons = users.map((p) => ({ label: `Usar em ${nameOf(p)}`, value: p, cls: 'green big' })).concat([{ label: 'Guardar', value: null, cls: 'outline big' }]);
  const choice = await choose(buttons, { autoValue: users[0] });
  if (choice) await useEvoItem(item, choice);
}
// Uma pedra de evolução: a roleta escolhe qual (e inclui itens especiais que alguém da equipe usa).
async function stoneWheel(title = 'Qual pedra você achou?') {
  const keys = STONES.filter((k) => EVO_ITEMS[k].some((id) => id <= maxId()));
  for (const [k, ids] of Object.entries(EVO_ITEMS)) if (!keys.includes(k) && ids.some((id) => id <= maxId()) && evoItemUsers(k).length) keys.push(k);
  const segs = keys.map((k) => ({ label: ITEMS[k].name, weight: evoItemUsers(k).length ? 2 : 1, color: ITEM_COLORS[k] || '#6d4c41', img: itemSprite(k), value: k }));
  return (await spinScene({ title, subtitle: 'Pedras de evolução fazem certos Pokémon evoluírem na hora.', segments: segs })).value;
}
// Treino no Centro Pokémon: ninguém fica muito para trás.
async function trainUp() {
  const floor = teamFloor(S.stage) + Math.min(0, diff());
  const low = S.team.filter((p) => p.level < floor);
  if (!low.length) return;
  low.forEach((p) => setLevel(p, floor));
  await message('Treino no Centro Pokémon', `Antes do próximo desafio, ${low.map((p) => `<b>${nameOf(p)}</b>`).join(', ')} treinaram e chegaram ao <b>Nv. ${floor}</b>.`, { sound: 'good' });
  await levelEvolutions();
}

// ---------------------- batalhas ----------------------
async function runBattle(o) {
  BUI.auto = M.settings.autoBattle || M.settings.autoPlay;
  await BUI.open({ terrain: o.terrain, auto: BUI.auto });
  const b = new Battle(S.team, { ...o, auto: BUI.auto, stage: S.stage, maxId: maxId() }, BUI);
  BUI.battle = b;
  let res;
  try { res = await b.run(); } catch (e) { console.error(e); res = 'error'; }
  BUI.close();
  S.team.forEach(healFull);
  if (b.stats.superCrit) unlock('crit');
  if (S.team.some((p) => p.level >= 50)) unlock('level50');
  if (res === 'caught' && b.caught) await addPokemon(b.caught);
  save(); renderAll();
  await levelEvolutions();
  return { res, b };
}

function trainerInfo(name, title, sprite, extra = {}) { return { name, title, sprite: sprite || name, ...extra }; }

// Encontro com um Pokémon selvagem (já sorteado).
async function wildEncounter(id, { level, terrain = 'grass', shiny = chance(1 / 64), legend = false, title } = {}) {
  const lvl = level ?? wildLevel(S.stage, diff());
  const mon = makePokemon(id, lvl, { shiny });
  if (M.settings.catchMode === 'direct') {
    if (legend) {
      const p = Math.min(0.6, 0.35 + 0.03 * badges());
      const seg = await spinScene({ title: `Capturar ${SPECIES[id].name}?`, subtitle: `Você joga a Poké Bola… (chance de ${Math.round(p * 100)}%)`, segments: yesNo('Capturou!', 'Fugiu…', p) });
      if (!seg.value) return message('Ele fugiu!', `O <b>${SPECIES[id].name}</b> lendário escapou e sumiu…`, { image: imgHTML(showSprite(id, shiny)), sound: 'bad' });
    }
    await addPokemon(mon);
    return message(shiny ? 'Shiny capturado!' : 'Capturado!', `Você capturou <b>${nameOf(mon)}</b>${shiny ? ' ✨ SHINY' : ''} (Nv. ${mon.level})!`, { image: imgHTML(showSprite(id, shiny)), sound: 'good', cry: id });
  }
  const { res, b } = await runBattle({ kind: 'wild', enemy: [mon], terrain, canCatch: true, legendRate: 20 + 3 * badges() });
  if (res === 'caught') {
    return message(mon.shiny ? 'Shiny capturado!' : 'Capturado!', `<b>${nameOf(mon)}</b>${mon.shiny ? ' ✨' : ''} entrou ${S.team.includes(mon) ? 'para a sua equipe' : 'no PC'}! (Nv. ${mon.level})`, { image: imgHTML(showSprite(mon.id, mon.shiny)), sound: 'good' });
  }
  if (res === 'win') return message('Vitória!', `Você derrotou o <b>${SPECIES[id].name}</b> selvagem e sua equipe ganhou experiência.`, { image: imgHTML(showSprite(id, shiny)) });
  if (res === 'fled') return message('Fugiu!', `O <b>${SPECIES[id].name}</b> selvagem fugiu da batalha.`, { image: imgHTML(showSprite(id, shiny)) });
  if (res === 'run') return message('Você fugiu', `Você deixou o <b>${SPECIES[id].name}</b> para trás.`);
  if (res === 'lose') return message('Derrota…', 'Seus Pokémon desmaiaram. Você correu para o Centro Pokémon, mas segue a jornada.', { sound: 'bad' });
  void title;
}

// Gira a roleta de Pokémon com a fatia "???" e começa o encontro.
async function spinWild(pool, title, subtitle, opts = {}) {
  if (!pool.length) pool = wildPool(S.gen, wildLevel(S.stage));
  const segs = pokeSegments(pool, { bonus: true });
  const shown = segs.filter((s) => !s.bonus).length;
  const seg = await spinScene({ title, subtitle: `${subtitle} (${pool.length} Pokémon possíveis${pool.length > shown ? `, ${shown} na roleta` : ''})`, segments: segs });
  if (seg.bonus) return bonusReveal(pool, opts);
  return wildEncounter(seg.value, opts);
}

async function bonusReveal(pool, opts) {
  const legends = legendPool(S.gen);
  const options = [
    { label: 'Shiny!', weight: 45, color: '#d4ac0d', value: 'shiny' },
    { label: 'Item raro', weight: 35, color: '#2980b9', value: 'item' },
  ];
  if (legends.length) options.push({ label: 'Lendário!', weight: 20, color: '#e67e22', value: 'legend' });
  const seg = await spinScene({ title: 'Fatia dourada!', subtitle: 'O que estava escondido no ???', segments: options });
  if (seg.value === 'shiny') {
    const id = pick(pool);
    await message('Brilho na grama!', `Um Pokémon <b>shiny</b> apareceu: <b>${SPECIES[id].name}</b>!`, { image: imgHTML(showSprite(id, true)), sound: 'good' });
    return wildEncounter(id, { ...opts, shiny: true });
  }
  if (seg.value === 'item') return giveItem(pick(['ultraball', 'masterball', 'rarecandy', 'reviver', 'superpotion']), 'Item raro!', 'Você achou');
  return EVENTS.legend();
}
