function eventSegments() {
  const allowed = {
    evolve: canEvolveList().length > 0,
    runaway: S.team.length > 1,
    magikarp: bagCount() > 0,
    legend: legendPool(S.gen).length > 0,
  };
  return EVENT_LIST.filter(([id]) => allowed[id] !== false).filter(([id]) => !S.pendingEvents || !id.startsWith('multi'))
    .map(([value, label, weight, color]) => ({ value, label: label || gen().villain, weight, color }));
}

function eventDone() {
  if (S.pendingEvents) S.pendingEvents--;
  if (!S.pendingEvents) S.eventsDone++;
  // Viajar junto aumenta a amizade (nos jogos, andar com o Pokémon na equipe).
  S.team.forEach((p) => addFriendship(p, 3));
  save();
}

async function adventureStep() {
  if (S.skipEvent) {
    const why = typeof S.skipEvent === 'string' ? S.skipEvent : 'Você ainda está dando a volta…';
    S.skipEvent = false;
    eventDone();
    return message('Evento perdido', `${why} Você deu a volta e <b>perdeu este evento</b>.`, { sound: 'bad' });
  }
  const info = stageInfo(S.stage);
  const seg = await spinScene({
    title: S.pendingEvents ? `Multievento! Faltam ${S.pendingEvents}` : 'O que acontece agora?',
    subtitle: `Próximo desafio: ${info.label} — ${info.name} ${typeTag(info.type)}`,
    segments: eventSegments(),
  });
  if (seg.value.startsWith('multi')) {
    S.pendingEvents = Number(seg.value.slice(5));
    save();
    await message('Multievento!', `A roleta vai girar <b>${S.pendingEvents} eventos</b> seguidos antes do próximo desafio!`, { sound: 'good' });
    return;
  }
  const dodge = await repelOrRope(seg);
  if (dodge === 'repel') return;
  if (dodge !== 'rope') await EVENTS[seg.value]();
  eventDone();
}

async function repelOrRope(seg) {
  const repel = (S.items.repel || 0) > 0;
  const rope = (S.items.escaperope || 0) > 0 && BAD_EVENTS.includes(seg.value);
  if (!repel && !rope) return null;
  setScene(`Caiu: ${seg.label}`, 'Quer usar um item antes?');
  showCard(`<div class="msg"><div class="msg-img">${repel ? itemImg('repel') : ''}${rope ? itemImg('escaperope') : ''}</div><div class="msg-text">A roleta caiu em <b>${seg.label}</b>.${rope ? '<br>É um evento ruim: a <b>Corda de Fuga</b> cancela.' : ''}${repel ? '<br>O <b>Repelente</b> gira a roleta de eventos de novo.' : ''}</div></div>`);
  const choice = await choose([{ label: 'Seguir', value: null, cls: 'outline big' }, repel && { label: 'Usar Repelente', value: 'repel', cls: 'green big' }, rope && { label: 'Usar Corda de Fuga', value: 'rope', cls: 'yellow big' }].filter(Boolean), { autoValue: rope ? 'rope' : null });
  if (!choice) return null;
  useItem(choice === 'repel' ? 'repel' : 'escaperope');
  await message(choice === 'repel' ? 'Repelente!' : 'Corda de Fuga!', choice === 'repel' ? 'Você seguiu por outro caminho. A roleta de eventos vai girar de novo!' : `Você escapou de <b>${seg.label}</b>!`, { sound: 'good' });
  return choice;
}

// ---------------------- ginásios e Liga ----------------------
const FEMALE_CHAMPS = ['Cynthia', 'Diantha', 'Geeta'];
function stageInfo(stage) {
  const g = gen();
  if (stage < 8) { const [name, type] = g.gyms[stage]; return { name, type, label: `Ginásio ${stage + 1}`, title: 'Líder', entry: g.gyms[stage] }; }
  if (stage < 12) { const e = g.elite[stage - 8]; return { name: e[0], type: e[1], label: `Elite dos 4 (${stage - 7}/4)`, title: 'Elite dos 4', entry: e }; }
  const c = g.champion;
  return { name: c[0], type: c[1], label: 'Campeão', title: FEMALE_CHAMPS.includes(c[0]) ? 'Campeã' : 'Campeão', entry: c };
}

async function reviveOrGameOver(lostTo, quote = '') {
  if ((S.items.reviver || 0) > 0) {
    useItem('reviver');
    S.revivesUsed++;
    save();
    await message('Reviver usado!', `${quote ? `<blockquote>${quote}</blockquote>` : ''}Você perdeu para ${lostTo}… mas o <b>Reviver</b> foi usado e sua equipe voltou com tudo. Mais uma chance!`, { image: itemImg('reviver'), button: 'Tentar de novo', sound: 'bad' });
    return true;
  }
  S.over = true;
  S.lostTo = lostTo;
  S.lostQuote = quote;
  M.best = Math.max(M.best, S.stage);
  save(); saveMeta();
  return false;
}

async function gymVillain() {
  const g = gen();
  const info = stageInfo(S.stage);
  const v = villainFor(S.gen, S.stage);
  const who = v.title === 'Recruta' ? v.name : `${v.name}, ${v.title}${v.title.includes(' da ') ? '' : ` da ${g.villain}`}`;
  await message(v.boss ? `O chefe da ${g.villain}!` : `A ${g.villain} está no caminho!`, `<b>${who}</b> bloqueou o caminho até o ${info.label}!<br><small>Perder aqui também gasta um Reviver.</small>`, { image: imgHTML(trainerSprite(v.sprite)), button: 'Batalhar!' });
  for (;;) {
    const enemy = villainTeam(S.gen, v, S.stage, diff());
    const { res } = await runBattle({ kind: 'villain', enemy, terrain: 'night', trainer: trainerInfo(v.title === 'Recruta' ? 'Recruta' : v.name, v.title === 'Recruta' ? '' : '', v.sprite, { quote: v.boss ? 'Você não vai estragar nossos planos!' : 'Ninguém passa por aqui!', items: v.boss ? ['superpotion'] : [] }) });
    if (res === 'win') {
      S.villainBeaten = S.stage;
      save();
      if (v.boss) Effects.confetti(80);
      await message(v.boss ? `Você derrotou o chefe da ${g.villain}!` : 'Vitória!', `${v.name} foi derrotado${v.boss ? ` e a ${g.villain} se desfez` : ''}! Agora falta pouco para o ${info.label}.`, { sound: 'good' });
      return true;
    }
    if (!(await reviveOrGameOver(who))) return false;
  }
}

async function challengeScreen(info) {
  const g = gen();
  const quote = pick(QUOTES_BEFORE[info.type || 'champion'] || QUOTES_BEFORE.champion);
  for (;;) {
    setScene(`${info.label} — ${info.title} ${info.name}`, info.type ? `Especialista em ${typeTag(info.type)}` : 'O treinador mais forte da região');
    const size = STAGE_SIZE[S.stage];
    const lvl = STAGE_ACE[S.stage] + diff();
    showCard(`<div class="msg challenge"><div class="msg-img">${imgHTML(trainerSprite(info.name), 'trainer-big')}</div><div class="msg-text">
      <blockquote>"${quote}"</blockquote>
      <p>${info.title} <b>${info.name}</b> vai usar <b>${size} Pokémon</b> (até Nv. ${lvl}).</p>
      ${matchupHTML(info.type)}
      <p class="hint">Dica: o primeiro da equipe começa a batalha. Arrume a ordem no PC.</p></div></div>`);
    renderAll();
    const act = await choose([{ label: 'Batalhar!', value: 'go', cls: 'red big' }, { label: 'Organizar equipe', value: 'pc', cls: 'outline big' }], { autoValue: 'go' });
    if (act === 'go') return quote;
    await openPC();
  }
  void g;
}
function matchupHTML(type) {
  if (!type) return '';
  const good = S.team.filter((p) => SPECIES[p.id].types.some((t) => (TYPE_CHART[t][type] ?? 1) > 1));
  const bad = S.team.filter((p) => (SPECIES[p.id].types.reduce((m, t) => m * (TYPE_CHART[type][t] ?? 1), 1)) > 1);
  const ico = (l) => l.map((p) => imgHTML(iconSprite(p.id, p.shiny), 'mini', nameOf(p))).join('');
  return `<div class="matchup">${good.length ? `<div class="good">Vantagem ${ico(good)}</div>` : ''}${bad.length ? `<div class="bad">Desvantagem ${ico(bad)}</div>` : ''}</div>`;
}

async function leagueBattle() {
  const info = stageInfo(S.stage);
  const quote = await challengeScreen(info);
  const g = gen();
  for (;;) {
    const enemy = bossTeam(S.gen, info.entry, S.stage, diff(), rivalStarter(S.gen, S.starterRoot));
    const items = S.stage >= 12 ? ['superpotion', 'superpotion', 'superpotion'] : S.stage >= 8 ? ['superpotion', 'superpotion'] : S.stage >= 3 ? ['superpotion'] : [];
    const terrain = info.type ? TYPE_TERRAIN[info.type] : 'league';
    const { res } = await runBattle({ kind: 'boss', enemy, terrain: S.stage >= 8 && !info.type ? 'league' : terrain, trainer: trainerInfo(info.name, info.title, info.name, { quote, winQuote: pick(QUOTES_WIN), loseQuote: pick(QUOTES_LOSE), items }) });
    if (res === 'win') {
      const was = S.stage;
      S.stage++;
      S.eventsDone = 0;
      if (S.stage <= 8) { M.bestBadges = Math.max(M.bestBadges, S.stage); unlock('badge1'); if (S.stage === 8) unlock('badge8'); }
      M.best = Math.max(M.best, S.stage);
      save(); saveMeta();
      applySkin();
      if (was < 8) {
        Effects.confetti(60);
        await message('Insígnia conquistada!', `Você derrotou ${info.name} e ganhou a <b>Insígnia ${BADGE_NAMES[g.id][was]}</b>!`, { image: `<span class="badge big got" style="--bc:${TYPES[info.type].color}"><i></i></span>`, sound: 'win' });
        await afterGym();
        await trainUp();
      } else if (S.stage < 13) {
        await message('Vitória!', `Você derrotou ${info.title === 'Elite dos 4' ? 'a Elite' : ''} ${info.name}! Siga em frente na Liga.`, { sound: 'win' });
        await trainUp();
      }
      return true;
    }
    if (!(await reviveOrGameOver(`${info.title} ${info.name}`, ''))) return false;
  }
}

async function afterGym() {
  const evo = canEvolveList();
  if (!evo.length) return giveItem('potion', 'Prêmio do ginásio', 'Ninguém da equipe pode evoluir, então o líder te deu uma');
  const p = S.evoChance || 0.25;
  const seg = await spinScene({ title: 'Alguém vai evoluir?', subtitle: 'Depois da vitória no ginásio… (cada "Não" aumenta a chance no próximo)', segments: yesNo('Sim', 'Não', p) });
  if (seg.value) { S.evoChance = 0.25; save(); return EVENTS.evolve(); }
  S.evoChance = Math.min(0.85, p + 0.15);
  save();
  return message('Não foi dessa vez', `Ninguém evoluiu. No próximo ginásio, a chance do Sim sobe para <b>${Math.round(S.evoChance * 100)}%</b>.`);
}

// ---------------------- início e fim ----------------------
function genUnlocked(id) { return M.settings.unlockAll || M.unlockedGens.includes(id); }
async function chooseGeneration() {
  setScene('Qual região?', 'Escolha onde sua aventura vai acontecer');
  const html = `<div class="gen-grid">${GENERATIONS.map((g) => `<button type="button" class="gen-btn${genUnlocked(g.id) ? '' : ' locked'}" data-g="${g.id}" style="--gc:${g.accent}"><b>Gen ${g.id}</b><span>${g.region}</span>${genUnlocked(g.id) ? '' : `<small>🔒 Zere a Gen ${g.id - 1}</small>`}</button>`).join('')}</div>`;
  showCard(html);
  renderAll();
  const picked = await new Promise((resolve) => {
    $('#card').querySelectorAll('.gen-btn').forEach((b) => (b.onclick = () => {
      const id = +b.dataset.g;
      Sound.ensure();
      if (!genUnlocked(id)) { Sound.bad(); toast(`Zere a Gen ${id - 1} para liberar ${genById(id).region}!`, '🔒'); return; }
      Sound.blip(); $('#actions').innerHTML = ''; resolve(id);
    }));
    choose([{ label: 'Prefiro sortear', value: 'random', cls: 'outline big' }]).then(resolve);
  });
  let id = picked;
  if (id === 'random') {
    const list = GENERATIONS.filter((g) => genUnlocked(g.id));
    id = list.length === 1 ? list[0].id : (await spinScene({ title: 'Sorteando a região…', segments: list.map((g) => ({ label: `Gen ${g.id} ${g.region}`, weight: 1, color: g.bg[0] === '#2a2d34' ? '#555b66' : mix(g.accent, '#000000', 0.25), value: g.id })) })).value;
  }
  S.gen = id;
  save();
  applyTheme();
}

async function chooseStarter() {
  const g = gen();
  S.items = { reviver: 1, potion: 2 };
  const seg = await spinScene({ title: 'Qual será seu inicial?', subtitle: `O Professor de ${g.region} tem três Pokémon para você…`, segments: pokeSegments(g.starters) });
  const mon = makePokemon(seg.value, 6, { shiny: chance(1 / 64), ivMin: 10 });
  S.starterRoot = seg.value;
  await addPokemon(mon, 'ganhou');
  S.caught = 0;
  save();
  await message('Seu parceiro!', `Seu Pokémon inicial é <b>${nameOf(mon)}</b>${mon.shiny ? ' ✨ SHINY' : ''}! O Professor também te deu <b>1 Reviver</b> (vida extra) e <b>2 Poções</b> para usar nas batalhas.<br><small>Perder para um Líder, a Equipe vilã ou a Liga gasta o Reviver. Sem ele, a tentativa acaba.</small>`, { image: imgHTML(showSprite(mon.id, mon.shiny)), sound: 'good', cry: mon.id, button: 'Começar a aventura!' });
}

async function gameOverScreen() {
  Sound.bad();
  setScene(`Fim da Tentativa #${M.attempt}`, `Você perdeu para <b>${S.lostTo}</b> e estava sem Reviver.`);
  showCard(`<div class="msg end">${S.lostQuote ? `<blockquote>${S.lostQuote}</blockquote>` : ''}<p>Insígnias: <b>${Math.min(S.stage, 8)}/8</b>${S.stage > 8 ? ` · Liga: ${S.stage - 8}/5` : ''}</p><div class="row">${S.team.map((p) => imgHTML(showSprite(p.id, p.shiny), 'end-sp', nameOf(p))).join('')}</div></div>`);
  renderAll();
  await choose([{ label: `Nova tentativa (#${M.attempt + 1})`, value: true }]);
  newAttempt();
}

async function victoryScreen() {
  Sound.win();
  Effects.confetti(220);
  setTimeout(() => Effects.confetti(160), 900);
  setScene('VOCÊ ZEROU A ROLETA!', `Tentativa #${M.attempt} · ${gen().region}`);
  showCard(`<div class="msg end"><p><b>Hall da Fama</b></p><div class="row">${S.team.map((p) => `<div class="hof">${imgHTML(showSprite(p.id, p.shiny), 'end-sp', nameOf(p))}<span>${nameOf(p)}<br>Nv ${p.level}</span></div>`).join('')}</div></div>`);
  renderAll();
  await choose([{ label: 'Jogar de novo', value: true }]);
  newAttempt();
}

function newAttempt() {
  M.attempt++;
  saveMeta();
  S = newState();
  save();
  main();
}

async function main() {
  applyTheme();
  applySkin();
  renderAll();
  if (S.over) return S.won ? victoryScreen() : gameOverScreen();
  if (!S.gen) await chooseGeneration();
  if (!S.team.length) await chooseStarter();
  while (S.stage < TOTAL_STAGES) {
    if (S.stage < 8) {
      if (S.pendingEvents || S.eventsDone < 1) { await adventureStep(); continue; }
      if (S.villainBeaten !== S.stage) { if (!(await gymVillain())) return gameOverScreen(); continue; }
      if (S.eventsDone < EVENTS_PER_GYM) { await adventureStep(); continue; }
    }
    if (!S.team.length) {
      await message('Sem Pokémon!', 'Sua equipe ficou vazia… O Professor te emprestou um Pokémon para seguir.', { button: 'Valeu!' });
      await addPokemon(makePokemon(pick(wildPool(S.gen, wildLevel(S.stage))), teamFloor(S.stage) || 5));
    }
    if (!(await leagueBattle())) return gameOverScreen();
  }
  if (!S.won) {
    S.won = true; S.over = true;
    M.wins++;
    M.best = TOTAL_STAGES;
    if (!M.unlockedGens.includes(S.gen + 1) && S.gen < 9) { M.unlockedGens.push(S.gen + 1); toast(`Nova região liberada: ${genById(S.gen + 1).region}!`, '🗺️'); }
    unlock('league');
    if (!S.revivesUsed) unlock('norevive');
    if (Object.keys(TYPES).some((t) => S.team.length && S.team.every((p) => SPECIES[p.id].types.includes(t)))) unlock('monotype');
    save(); saveMeta();
  }
  victoryScreen();
}

// ---------------------- conquistas e skins ----------------------
function unlock(id) {
  if (M.achievements[id]) return;
  M.achievements[id] = Date.now();
  saveMeta();
  const a = ACHIEVEMENTS.find((x) => x[0] === id);
  if (a) toast(`Conquista: <b>${a[2]}</b>`, a[1]);
}
function skinUnlocked(s) { return (!s.badges || M.bestBadges >= s.badges) && (!s.wins || M.wins >= s.wins); }
function applySkin() {
  let s = WHEEL_SKINS.find((x) => x.id === M.skin) || WHEEL_SKINS[0];
  if (!skinUnlocked(s)) s = WHEEL_SKINS[0];
  if (wheel) wheel.setSkin(s);
}

// ---------------------- janelas ----------------------
function openModal(title, html, onClose) {
  const m = $('#modal');
  m.innerHTML = `<div class="modal-card" role="dialog" aria-label="${title}"><div class="modal-head"><h2>${title}</h2><button type="button" class="x" aria-label="Fechar">✕</button></div><div class="modal-body">${html}</div></div>`;
  m.hidden = false;
  const close = () => { m.hidden = true; m.innerHTML = ''; if (onClose) onClose(); };
  m.querySelector('.x').onclick = close;
  m.onclick = (e) => { if (e.target === m) close(); };
  return { el: m, close };
}

function openDetails(p) {
  const s = SPECIES[p.id];
  const st = stats(p);
  const labels = ['HP', 'Ataque', 'Defesa', 'At. Esp.', 'Def. Esp.', 'Velocidade'];
  const xp = p.level >= 100 ? 1 : (p.exp - expAt(p.level)) / (expAt(p.level + 1) - expAt(p.level));
  const evo = evosOf(p.id, S.gen ? maxId() : 1025).map((e) => `${SPECIES[e].name} (${evoMethodText(e)})`).join(', ');
  const fr = p.friendship ?? 70;
  const hearts = fr >= FRIEND_EVOLVE ? '♥♥♥♥♥' : fr >= 150 ? '♥♥♥♥♡' : fr >= 100 ? '♥♥♥♡♡' : fr >= 70 ? '♥♥♡♡♡' : '♥♡♡♡♡';
  openModal(`${nameOf(p)}${p.shiny ? ' ★' : ''}`, `<div class="det">
    <div class="det-top">${imgHTML(showSprite(p.id, p.shiny), 'det-sp')}<div>
      <p>Nv <b>${p.level}</b> ${p.gender === 'M' ? '<span class="g m">♂</span>' : p.gender === 'F' ? '<span class="g f">♀</span>' : ''} ${s.types.map(typeTag).join(' ')}</p>
      <div class="xpline"><i style="width:${xp * 100}%"></i></div><p class="hint">EXP para o Nv ${p.level + 1}: ${Math.max(0, expAt(p.level + 1) - p.exp)}</p>
      ${evo ? `<p class="hint">Evolui para: ${evo}</p>` : ''}<p class="hint">Amizade: <span class="hearts">${hearts}</span></p></div></div>
    <div class="det-stats">${st.map((v, i) => `<div><span>${labels[i]}</span><b>${v}</b><i style="width:${Math.min(100, (v / (p.level * 2.6 + 20)) * 100)}%"></i></div>`).join('')}</div>
    <div class="det-moves">${p.moves.map((m) => { const mv = MOVES[m.id]; return `<div class="mvrow"><span class="type" style="background:${TYPES[mv.type].color}">${TYPES[mv.type].name}</span><b>${mv.name}</b><small>${mv.cat === 'phys' ? 'Físico' : mv.cat === 'spec' ? 'Especial' : 'Status'}${mv.bp ? ` · ${mv.bp}` : ''} · PP ${m.maxpp}</small></div>`; }).join('')}</div>
  </div>`);
}

let pcSel = null;
function openPC() {
  return new Promise((resolve) => {
    pcSel = null;
    const { el } = openModal('PC do Bill', '<div class="pc"></div>', () => { renderAll(); save(); resolve(); });
    const draw = () => {
      const body = el.querySelector('.pc');
      const cell = (p, list, i) => `<button type="button" class="pcs${pcSel && pcSel.list === list && pcSel.i === i ? ' sel' : ''}" data-l="${list}" data-i="${i}">${imgHTML(iconStrip(p.id), 'pci')}<span>${nameOf(p).toUpperCase()}</span><small>Nv${p.level}</small></button>`;
      body.innerHTML = `<p class="hint">Clique em um Pokémon e depois em outro para trocar de lugar. O primeiro da equipe começa as batalhas.</p>
        <h3>Equipe (${S.team.length}/6)</h3><div class="pcgrid">${S.team.map((p, i) => cell(p, 'team', i)).join('')}</div>
        <h3>Caixa (${S.pc.length})</h3><div class="pcgrid">${S.pc.length ? S.pc.map((p, i) => cell(p, 'pc', i)).join('') : '<p class="hint">Vazia. Pokémon capturados com a equipe cheia vêm para cá.</p>'}</div>
        ${pcSel ? `<div class="pc-actions"><button type="button" class="btn outline" data-act="det">Ver detalhes</button>${pcSel.list === 'team' && S.team.length > 1 ? '<button type="button" class="btn outline" data-act="box">Guardar na caixa</button>' : ''}${pcSel.list === 'pc' && S.team.length < 6 ? '<button type="button" class="btn green" data-act="take">Levar para a equipe</button>' : ''}</div>` : ''}`;
      body.querySelectorAll('.pcs').forEach((b) => (b.onclick = () => {
        const list = b.dataset.l, i = +b.dataset.i;
        Sound.blip();
        if (!pcSel) { pcSel = { list, i }; draw(); return; }
        if (pcSel.list === list && pcSel.i === i) { pcSel = null; draw(); return; }
        const A = pcSel.list === 'team' ? S.team : S.pc, B = list === 'team' ? S.team : S.pc;
        [A[pcSel.i], B[i]] = [B[i], A[pcSel.i]];
        pcSel = null; save(); draw(); renderAll();
      }));
      body.querySelectorAll('[data-act]').forEach((b) => (b.onclick = () => {
        const act = b.dataset.act;
        const p = (pcSel.list === 'team' ? S.team : S.pc)[pcSel.i];
        if (act === 'det') { const keep = pcSel; openDetails(p); pcSel = keep; return; }
        if (act === 'box') { S.pc.push(...S.team.splice(pcSel.i, 1)); }
        if (act === 'take') { S.team.push(...S.pc.splice(pcSel.i, 1)); if (S.team.length === 6) unlock('fullteam'); }
        pcSel = null; save(); draw(); renderAll();
      }));
    };
    draw();
  });
}

function openAchievements() {
  const got = ACHIEVEMENTS.filter((a) => M.achievements[a[0]]).length;
  const { el } = openModal('Conquistas', `<p class="hint">${got}/${ACHIEVEMENTS.length} conquistas · ${M.wins} vez${M.wins === 1 ? '' : 'es'} zerado · ${M.attempt} tentativa${M.attempt === 1 ? '' : 's'}</p>
    <div class="ach">${ACHIEVEMENTS.map(([id, ic, name, how]) => `<div class="ac${M.achievements[id] ? ' got' : ''}"><span class="ai">${M.achievements[id] ? ic : '🔒'}</span><div><b>${name}</b><small>${how}</small></div></div>`).join('')}</div>
    <h3>Visual da roleta</h3><div class="skins">${WHEEL_SKINS.map((s) => `<button type="button" class="skin${skinUnlocked(s) ? '' : ' locked'}${M.skin === s.id ? ' sel' : ''}" data-s="${s.id}" style="--rim:${s.rim};--st:${s.studs}"><i></i><b>${s.name}</b><small>${skinUnlocked(s) ? (M.skin === s.id ? 'Em uso' : 'Clique para usar') : s.how}</small></button>`).join('')}</div>`);
  el.querySelectorAll('.skin').forEach((b) => (b.onclick = () => {
    const s = WHEEL_SKINS.find((x) => x.id === b.dataset.s);
    if (!skinUnlocked(s)) { toast(s.how, '🔒'); return; }
    M.skin = s.id; saveMeta(); applySkin(); el.hidden = true; openAchievements();
  }));
}

function openSettings() {
  const st = M.settings;
  const opt = (key, label, values, hint = '') => `<div class="set"><div><b>${label}</b>${hint ? `<small>${hint}</small>` : ''}</div><div class="seg">${values.map(([v, t]) => `<button type="button" data-k="${key}" data-v="${v}" class="${String(st[key]) === String(v) ? 'on' : ''}">${t}</button>`).join('')}</div></div>`;
  const { el } = openModal('Configurações', `
    ${opt('catchMode', 'Pokémon selvagem', [['battle', 'Batalha GBA'], ['direct', 'Captura direta']], 'Batalhar e jogar Poké Bola, ou capturar direto como na roleta original')}
    ${opt('difficulty', 'Dificuldade', [['facil', 'Fácil'], ['normal', 'Normal'], ['dificil', 'Difícil']], 'Muda o nível dos treinadores, líderes e da Liga')}
    ${opt('textSpeed', 'Texto da batalha', [['normal', 'Normal'], ['rápido', 'Rápido'], ['instantâneo', 'Instantâneo']])}
    ${opt('wheelSpeed', 'Roleta', [['normal', 'Normal'], ['rápida', 'Rápida']])}
    ${opt('autoBattle', 'Batalhas automáticas', [['false', 'Não'], ['true', 'Sim']], 'A batalha escolhe os golpes sozinha (dá para ligar e desligar no botão AUTO)')}
    ${opt('autoPlay', 'Jogo automático', [['false', 'Não'], ['true', 'Sim']], 'Gira as roletas e avança sozinho. Bom para gravar vídeo')}
    ${opt('unlockAll', 'Todas as regiões', [['false', 'Bloqueadas'], ['true', 'Liberadas']], 'Normalmente cada região abre quando você zera a anterior')}
    <div class="set danger"><div><b>Apagar tudo</b><small>Some com a tentativa atual, as conquistas e o progresso das regiões.</small></div><button type="button" class="btn red" id="wipe">Apagar progresso</button></div>`);
  el.querySelectorAll('.seg button').forEach((b) => (b.onclick = () => {
    const k = b.dataset.k; let v = b.dataset.v;
    if (v === 'true') v = true; else if (v === 'false') v = false;
    st[k] = v;
    saveMeta();
    if (k === 'textSpeed') BUI.setSpeed(v);
    b.parentElement.querySelectorAll('button').forEach((x) => x.classList.toggle('on', x === b));
    Sound.blip();
  }));
  el.querySelector('#wipe').onclick = () => {
    const w = el.querySelector('.danger');
    w.innerHTML = '<div><b>Tem certeza?</b><small>Isso não pode ser desfeito.</small></div><div class="seg"><button type="button" class="btn red" id="wipe-yes">Sim, apagar</button><button type="button" class="btn outline" id="wipe-no">Cancelar</button></div>';
    w.querySelector('#wipe-no').onclick = () => { el.hidden = true; openSettings(); };
    w.querySelector('#wipe-yes').onclick = () => {
      try { localStorage.removeItem(SAVE_KEY); localStorage.removeItem(META_KEY); } catch (e) { /* nada */ }
      location.reload();
    };
  };
}

function confirmRestart() {
  const { el, close } = openModal('Reiniciar', `<p>Começar uma nova tentativa agora? A tentativa atual (${S.gen ? `${gen().region}, ${badges()} insígnia${badges() === 1 ? '' : 's'}` : 'ainda no começo'}) será perdida.</p><div class="row-btns"><button type="button" class="btn red" id="rs-yes">Sim, nova tentativa</button><button type="button" class="btn outline" id="rs-no">Cancelar</button></div>`);
  el.querySelector('#rs-no').onclick = close;
  el.querySelector('#rs-yes').onclick = () => {
    if (S.gen && !S.over) M.best = Math.max(M.best, S.stage);
    M.attempt++;
    saveMeta();
    S = newState();
    save();
    location.reload();
  };
}

// ---------------------- efeitos visuais ----------------------
const Effects = {
  confetti(n = 120) {
    const box = $('#confetti');
    const colors = ['#ffde00', '#e3350d', '#3b8ef0', '#2ecc71', '#ff7ab8', '#ffffff'];
    for (let i = 0; i < n; i++) {
      const c = document.createElement('i');
      c.style.left = `${Math.random() * 100}%`;
      c.style.background = pick(colors);
      c.style.setProperty('--d', `${2 + Math.random() * 2.5}s`);
      c.style.setProperty('--x', `${(Math.random() - 0.5) * 200}px`);
      c.style.animationDelay = `${Math.random() * 0.6}s`;
      box.appendChild(c);
      setTimeout(() => c.remove(), 5500);
    }
  },
  shake() { const a = $('#app'); a.classList.remove('shake'); void a.offsetWidth; a.classList.add('shake'); },
};

// ---------------------- início ----------------------
function boot(dataSpecies, dataMoves, dataLearn) {
  parseData(dataSpecies, dataMoves, dataLearn);
  Sound.on = M.settings.sound;
  wheel = new Wheel($('#wheel'));
  FONTS_READY.then(() => { wheel.render(); wheel.draw(); });
  BUI = new BattleUI($('#battle'));
  BUI.setSpeed(M.settings.textSpeed);
  BUI.getBag = () => S.items;
  BUI.onConsume = (k) => useItem(k);
  BUI.onSpeedChange = (v) => { M.settings.textSpeed = v; saveMeta(); };
  $('#btn-reset').onclick = confirmRestart;
  $('#btn-ach').onclick = openAchievements;
  $('#btn-settings').onclick = openSettings;
  $('#btn-pc').onclick = () => openPC();
  $('#btn-sound').onclick = () => { M.settings.sound = !M.settings.sound; Sound.on = M.settings.sound; if (!Sound.on) Sound.lowHp(false); saveMeta(); renderAll(); };
  document.addEventListener('pointerdown', () => Sound.ensure(), { once: true });
  // Saves antigos sem dados válidos começam do zero.
  if (S.gen && !genById(S.gen)) S = newState();
  S.team = (S.team || []).filter((p) => SPECIES[p.id]);
  S.pc = (S.pc || []).filter((p) => SPECIES[p.id]);
  main().catch((e) => { console.error(e); setScene('Ops! Algo deu errado.', 'Recarregue a página para continuar de onde parou.'); });
  setTimeout(checkSprites, 1500);
}

// Aviso quando as imagens dos Pokémon não chegam (sem internet ou app que bloqueia imagens de fora).
async function checkSprites() {
  const ok = await spriteCheck();
  let el = $('#netwarn');
  if (ok) { if (el) el.remove(); return true; }
  if (!el) {
    el = document.createElement('div');
    el.id = 'netwarn';
    el.setAttribute('role', 'alert');
    el.innerHTML = `<p><b>Os sprites dos Pokémon não carregaram.</b> Eles vêm da internet (PokeAPI e pokeemerald-expansion) na hora em que você joga. Abra este arquivo no <b>Chrome</b> ou em outro navegador, com internet: a pré-visualização dentro de alguns apps bloqueia imagens de fora.</p><div class="row-btns"><button type="button" class="btn small" data-a="retry">Tentar de novo</button><button type="button" class="btn small" data-a="close">Fechar aviso</button></div>`;
    document.body.appendChild(el);
    el.querySelector('[data-a="close"]').onclick = () => el.remove();
    el.querySelector('[data-a="retry"]').onclick = async (ev) => {
      ev.target.disabled = true;
      if (await checkSprites()) {
        resetSpriteCaches();
        if (wheel.segs.length) wheel.setSegments(wheel.segs.map(({ image, start, size, ...seg }) => seg));
        renderAll();
        toast('Sprites carregados!', '✓');
      } else ev.target.disabled = false;
    };
  }
  return false;
}
